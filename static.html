<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>World Map - Static</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #e8eef3; }

  /* ============ Map viewport ============ */
  #viewport {
    position: absolute; inset: 0; overflow: hidden;
    cursor: grab; touch-action: none;
    background: #cfe0ea;
  }
  #viewport.dragging { cursor: grabbing; }

  /* Single GPU-composited container. All tiles live here.
     The container is transformed as a whole - never per-tile. */
  #tiles {
    position: absolute; left: 0; top: 0;
    width: 0; height: 0;
    transform-origin: 0 0;
    will-change: transform;
    backface-visibility: hidden;
  }
  #tiles img {
    position: absolute;
    left: 0; top: 0;
    -webkit-user-drag: none; user-select: none;
    pointer-events: none;
    /* fade in when a tile arrives */
    opacity: 0;
    transition: opacity .18s linear;
  }
  #tiles img.ready { opacity: 1; }

  /* ============ Top bar ============ */
  #topbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 12px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 4px 20px rgba(0,0,0,.16);
    backdrop-filter: blur(10px);
    max-width: calc(100vw - 24px);
  }

  /* Coordinate jump box */
  #gotoInput {
    width: 190px; padding: 8px 10px;
    border: 1px solid #d8dee6; border-radius: 8px;
    font-size: 12px; font-family: Consolas, monospace;
    color: #334155; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #gotoInput::placeholder { color: #a8b3c2; }
  #gotoInput:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,.14);
  }
  #gotoInput.bad { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.14); }

  .btn {
    padding: 8px 13px; border: 1px solid #d8dee6; border-radius: 8px;
    background: #fff; color: #333; font-size: 13px; cursor: pointer;
    white-space: nowrap; transition: all .15s;
    font-family: inherit;
  }
  .btn:hover { background: #f4f7fb; border-color: #b8c4d4; }
  .btn:active { transform: translateY(1px); }
  .btn.icon { padding: 8px 11px; font-size: 15px; line-height: 1; }

  #zoomLabel {
    min-width: 74px; text-align: center; font-size: 12.5px;
    color: #475569; font-family: Consolas, monospace;
  }

  .sep { width: 1px; height: 22px; background: #e2e8f0; margin: 0 2px; }

  /* ============ Layer switcher ============ */
  #layers {
    position: fixed; right: 12px; top: 76px; z-index: 100;
    display: flex; flex-direction: column; gap: 5px;
    padding: 8px; border-radius: 11px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 4px 20px rgba(0,0,0,.16);
    backdrop-filter: blur(10px);
  }
  #layers .title {
    font-size: 10.5px; color: #94a3b8; padding: 1px 5px 4px;
    letter-spacing: .5px; font-weight: 600; text-transform: uppercase;
  }
  #layers button {
    padding: 6px 12px; border: none; border-radius: 7px;
    background: transparent; color: #475569; font-size: 12.5px;
    cursor: pointer; text-align: left; white-space: nowrap;
    transition: all .12s; font-family: inherit;
    display: block; width: 100%;
  }
  #layers button:hover { background: #f1f5f9; color: #1e293b; }
  #layers button.on { background: #3b82f6; color: #fff; }
  #layers button.on .ld { color: rgba(255,255,255,.8); }
  #layers button.on .ln { font-weight: 600; }

  #layers .ln { display: block; line-height: 1.35; }
  #layers .ld {
    display: block; font-size: 10px; line-height: 1.4;
    color: #94a3b8; margin-top: 1px; white-space: normal;
  }

  /* Divider before the slower, overseas-hosted layers */
  #layers .slowsep {
    margin: 4px 6px 2px;
    padding-top: 5px;
    border-top: 1px solid #eef2f7;
    font-size: 9.5px; letter-spacing: .3px;
    color: #b6c0cc; text-transform: uppercase; font-weight: 600;
  }

  /* Layer hint: which source covers which part of the world.
     There is no automatic switching any more - the user chooses. */
  #layers .hint {
    margin-top: 3px; padding: 7px 8px 6px;
    border-top: 1px solid #eef2f7;
    font-size: 10.5px; line-height: 1.7; color: #64748b;
    white-space: normal; width: 100%;
  }
  #layers .hint b { color: #334155; font-weight: 600; display: inline-block; }
  #layers .hint span { color: #94a3b8; font-size: 10px; display: block; margin-top: 2px; }
  #layers .hint .row { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }

  /* ============ Bottom info ============ */
  #foot {
    position: fixed; left: 12px; bottom: 12px; z-index: 100;
    display: flex; gap: 10px; align-items: center;
  }
  .chip {
    padding: 7px 13px; border-radius: 8px;
    background: rgba(255,255,255,.94); color: #475569;
    font-size: 12px; font-family: Consolas, monospace;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
    backdrop-filter: blur(8px);
  }
  .chip b { color: #2563eb; font-weight: 600; }

  /* ============ Crosshair ============ */
  /* Two plain lines crossing at the viewport centre - no gaps, no dot.
     Pinned to the screen, so it always marks state.center / "Center".
     A white halo keeps it readable on both pale streets and dark satellite. */
  #crosshair {
    position: fixed;
    left: 50%; top: 50%;
    width: 56px; height: 56px;
    margin: -28px 0 0 -28px;
    pointer-events: none;
    z-index: 95;
  }
  #crosshair i {
    position: absolute;
    display: block;
    background: rgba(15,23,42,.85);
    box-shadow: 0 0 0 1px rgba(255,255,255,.9);
  }
  #crosshair .ch-h { left: 0;  top: 50%;    width: 100%; height: 1px; margin-top: -.5px; }
  #crosshair .ch-v { top: 0;   left: 50%;   height: 100%; width: 1px;  margin-left: -.5px; }

  /* ============ Credit ============ */
  #credit {
    position: fixed; right: 12px; bottom: 12px; z-index: 100;
    padding: 5px 10px; border-radius: 6px;
    background: rgba(255,255,255,.88); color: #64748b;
    font-size: 10.5px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }

  /* ============ Loader ============ */
  #loader {
    position: fixed; inset: 0; z-index: 500;
    display: flex; align-items: center; justify-content: center;
    background: #e8eef3; color: #64748b; font-size: 14px;
    transition: opacity .4s;
  }
  #loader.hide { opacity: 0; pointer-events: none; }

  /* ============ Toast ============ */
  #toast {
    position: fixed; left: 50%; bottom: 60px;
    transform: translateX(-50%) translateY(10px);
    z-index: 200; padding: 9px 18px; border-radius: 8px;
    background: rgba(30,41,59,.92); color: #fff; font-size: 12.5px;
    opacity: 0; transition: all .25s; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ Cursor readout ============ */
  #foot .chip.cursor { min-width: 190px; }
  #foot .chip.cursor b { color: #16a34a; }

  /* ============ Bookmarks ============ */
  #bookmarks {
    position: fixed; left: 12px; top: 76px; z-index: 100;
    width: 230px; max-height: 48vh;
    display: none; flex-direction: column;
    border-radius: 11px; overflow: hidden;
    background: rgba(255,255,255,.96);
    box-shadow: 0 4px 20px rgba(0,0,0,.16);
    backdrop-filter: blur(10px);
  }
  #bookmarks.show { display: flex; }

  #bookmarks .bm-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px 6px;
    font-size: 10.5px; color: #94a3b8;
    letter-spacing: .5px; font-weight: 600; text-transform: uppercase;
    border-bottom: 1px solid #eef2f7;
  }
  #bookmarks .bm-head span { color: #cbd5e1; font-weight: 500; letter-spacing: 0; text-transform: none; }

  #bookmarks .bm-list { overflow-y: auto; padding: 4px; }

  .bm-item {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 8px; border-radius: 7px;
    cursor: pointer; transition: background .12s;
  }
  .bm-item:hover { background: #eff6ff; }

  .bm-item .bm-idx {
    flex: 0 0 18px; height: 18px; line-height: 18px;
    text-align: center; border-radius: 50%;
    background: #3b82f6; color: #fff;
    font-size: 10px; font-weight: 600;
  }
  .bm-item .bm-body { flex: 1; min-width: 0; }
  .bm-item .bm-name {
    font-size: 12.5px; color: #1e293b;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bm-item .bm-coord {
    font-size: 10.5px; color: #94a3b8;
    font-family: Consolas, monospace; margin-top: 1px;
  }
  .bm-item .bm-del {
    flex: 0 0 auto; padding: 2px 5px; border: none;
    background: transparent; color: #cbd5e1;
    font-size: 14px; line-height: 1; cursor: pointer; border-radius: 4px;
  }
  .bm-item .bm-del:hover { background: #fee2e2; color: #dc2626; }

  #bookmarks .bm-empty {
    padding: 14px 10px; text-align: center;
    font-size: 11.5px; color: #94a3b8; line-height: 1.6;
  }

  @media (max-width: 640px) {
    #layers { top: auto; bottom: 56px; }
    .chip { font-size: 11px; padding: 6px 9px; }
    #bookmarks { top: 64px; width: 190px; max-height: 38vh; }
    #foot .chip.cursor { min-width: 0; }
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="tiles"></div>
</div>

<div id="crosshair">
  <i class="ch-h"></i><i class="ch-v"></i>
</div>

<div id="topbar">
  <button class="btn icon" id="zoomOut" data-i18n-title="zoomOut" title="Zoom out">&minus;</button>
  <div id="zoomLabel">Zoom 4</div>
  <button class="btn icon" id="zoomIn" data-i18n-title="zoomIn" title="Zoom in">+</button>
  <div class="sep"></div>
  <button class="btn" id="btnReset" data-i18n="reset" data-i18n-title="resetTip" title="Reset view">Reset</button>
  <button class="btn" id="btnLocate" data-i18n="locate" data-i18n-title="locateTip" title="Find my location">Locate</button>
  <button class="btn" id="btnSave" data-i18n="save" data-i18n-title="saveTip" title="Save cursor position (Ctrl+D)">&#9734; Save</button>
  <div class="sep"></div>
  <input id="gotoInput" data-i18n-ph="gotoPh" placeholder="lat, lon  e.g. 13.58,144.92" autocomplete="off"
         spellcheck="false" data-i18n-title="gotoTip" title="Type coordinates and press Enter">
  <div class="sep"></div>
  <button class="btn" id="btnLang" title="Switch language">中文</button>
</div>

<div id="layers">
  <div class="title" data-i18n="layers">Layers</div>
  <div id="layerList"></div>
</div>

<div id="bookmarks">
  <div class="bm-head"><span id="bm-title">Bookmarks</span> <span id="bm-count">0</span></div>
  <div class="bm-list" id="bm-list"></div>
</div>

<div id="foot">
  <div class="chip cursor" id="chip-cursor"><span data-i18n="cursor">Cursor</span>&nbsp; <b id="m-lat">&mdash;</b>, <b id="m-lng">&mdash;</b></div>
  <div class="chip"><span data-i18n="center">Center</span> <b id="c-lat">&mdash;</b>, <b id="c-lng">&mdash;</b></div>
</div>

<div id="credit">&copy; OpenStreetMap &middot; Amap &middot; Esri</div>
<div id="loader" data-i18n="loading">Loading map...</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  // ============================================================
  //  Config
  // ============================================================
  var TILE = 256;
  var MIN_Z = 2, MAX_Z = 18;

  // How many extra tile rings to keep around the viewport.
  // 1 ring means panning stays smooth without refetching.
  var PAD = 1;

  // Each layer carries a bilingual name plus a one-line note explaining
  // what it is actually good for. Both are rendered in the layer panel.
  var LAYERS = {
    amapSat: {
      name: 'Amap Satellite',
      nameZh: '\u9ad8\u5fb7\u536b\u661f',
      note: 'Freshest imagery inside China',
      noteZh: '\u56fd\u5185\u5f71\u50cf\u6700\u65b0',
      url: 'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
      subdomains: ['1', '2', '3', '4'],
      max: 18,
      credit: '&copy; Amap'
    },
    amap: {
      name: 'Amap Street',
      nameZh: '\u9ad8\u5fb7\u8857\u9053',
      note: 'Chinese street map, house numbers at z18',
      noteZh: '\u4e2d\u6587\u8857\u9053\u56fe\uff0cz18 \u6709\u95e8\u724c\u53f7',
      // wprd is the detailed endpoint. style=7 is the FULL street map
      // (land fill, buildings, parks, roads, labels). style=8 is only the
      // transparent road+label overlay meant to sit on a base layer.
      url: 'https://wprd0{s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=7',
      subdomains: ['1', '2', '3', '4'],
      // z19 comes back as a ~190-byte blank placeholder
      max: 18,
      credit: '&copy; Amap'
    },
    esriSat: {
      name: 'Esri Satellite',
      nameZh: 'Esri \u536b\u661f',
      note: 'Global imagery - the one to use overseas',
      noteZh: '\u5168\u7403\u5f71\u50cf\u2014\u2014\u5883\u5916\u7528\u8fd9\u4e2a',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      max: 18,
      credit: 'Esri, Maxar, Earthstar'
    },
    gray: {
      name: 'Light Grey',
      nameZh: '\u6d45\u7070\u5e95\u56fe',
      note: 'Minimal canvas - sparse inside China',
      noteZh: '\u6781\u7b80\u5e95\u56fe\uff08\u56fd\u5185\u8def\u7f51\u7a00\u758f\uff09',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      max: 18,
      credit: 'Esri, HERE, Garmin'
    },
    dark: {
      name: 'Dark Grey',
      nameZh: '\u6df1\u7070\u5e95\u56fe',
      note: 'Dark canvas - sparse inside China',
      noteZh: '\u6df1\u8272\u5e95\u56fe\uff08\u56fd\u5185\u8def\u7f51\u7a00\u758f\uff09',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      max: 18,
      credit: 'Esri, HERE, Garmin'
    },
    osm: {
      name: 'OSM Bilingual',
      nameZh: 'OSM \u53cc\u8bed',
      note: 'Chinese + English labels, clear town names',
      noteZh: '\u4e2d\u82f1\u53cc\u8bed\u6807\u6ce8\uff0c\u4e61\u9547\u540d\u6e05\u695a',
      url: 'https://tile.openstreetmap.de/{z}/{x}/{y}.png',
      max: 18,
      credit: '&copy; OpenStreetMap contributors'
    },
    hot: {
      name: 'OSM Humanitarian',
      nameZh: 'OSM \u4eba\u9053\u4e3b\u4e49',
      note: 'High-contrast style - slow, hosted in Europe',
      noteZh: '\u9ad8\u5bf9\u6bd4\u5ea6\u98ce\u683c\uff08\u6b27\u6d32\u670d\u52a1\u5668\uff0c\u8f83\u6162\uff09',
      url: 'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',
      subdomains: ['a', 'b', 'c', 'a', 'b', 'c'],
      // Overseas host: 0.5-5s per tile. Push parallelism hard so a
      // screenful lands in a few seconds instead of half a minute.
      maxInflight: 16,
      max: 17,
      slow: true,
      credit: '&copy; OpenStreetMap contributors, HOT'
    },
    cyclosm: {
      name: 'CyclOSM',
      nameZh: 'CyclOSM \u5730\u5f62',
      note: 'Terrain and cycling detail - slow, hosted in Europe',
      noteZh: '\u5730\u5f62\u4e0e\u9a91\u884c\u7ec6\u8282\uff08\u6b27\u6d32\u670d\u52a1\u5668\uff0c\u8f83\u6162\uff09',
      url: 'https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',
      subdomains: ['a', 'b', 'c', 'a', 'b', 'c'],
      maxInflight: 16,
      max: 17,
      slow: true,
      credit: '&copy; OpenStreetMap contributors, CyclOSM'
    }
  };

  // ============================================================
  //  State
  //  center is kept in world pixels at the CURRENT zoom level.
  // ============================================================
  var state = {
    center: { x: 0, y: 0 },
    zoom: 4,
    // Amap Satellite is the default: for mainland China its imagery is
    // noticeably fresher than Esri's. Esri's Xiamen block is dated
    // 2025-01-19, while Amap already shows buildings finished later that
    // year. Esri stays available for overseas points, where Amap has no
    // coverage at all.
    layer: 'amapSat'
  };

  var HOME = { lat: 32, lng: 112, zoom: 4 };

  var viewport = document.getElementById('viewport');
  var tilesBox = document.getElementById('tiles');
  var zoomLabel = document.getElementById('zoomLabel');
  var toastEl = document.getElementById('toast');
  var loader = document.getElementById('loader');

  // ============================================================
  //  Web Mercator projection
  // ============================================================
  function lngToWorldX(lng, z) {
    return (lng + 180) / 360 * Math.pow(2, z) * TILE;
  }
  function latToWorldY(lat, z) {
    var rad = lat * Math.PI / 180;
    var y = Math.log(Math.tan(Math.PI / 4 + rad / 2));
    return (1 - y / Math.PI) / 2 * Math.pow(2, z) * TILE;
  }
  function worldXToLng(x, z) {
    return x / (Math.pow(2, z) * TILE) * 360 - 180;
  }
  function worldYToLat(y, z) {
    var n = Math.PI - 2 * Math.PI * y / (Math.pow(2, z) * TILE);
    return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
  }

  // ============================================================
  //  Datum shift: WGS-84  <->  GCJ-02
  //
  //  Amap tiles are cut in GCJ-02 (the "Mars coordinate" datum used by
  //  every Chinese mapping service). Everywhere else - Esri, OSM, GPS -
  //  is WGS-84. Inside China the two differ by roughly 100-600 m, so
  //  feeding WGS-84 numbers straight into an Amap layer puts you on the
  //  wrong street.
  //
  //  Everything inside this file is stored in WGS-84. Only the Amap
  //  layers are converted, and only at the point where world pixels are
  //  computed, so readouts, bookmarks and the jump box all stay WGS-84.
  // ============================================================
  var GCJ_A = 6378245.0;
  var GCJ_EE = 0.00669342162296594323;

  function outOfChina(lat, lng) {
    return !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55);
  }

  function gcjDLat(x, y) {
    var r = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    r += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
    r += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
    r += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320.0 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
    return r;
  }

  function gcjDLng(x, y) {
    var r = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    r += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
    r += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
    r += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
    return r;
  }

  function wgs84ToGcj02(lat, lng) {
    if (outOfChina(lat, lng)) return { lat: lat, lng: lng };

    var dLat = gcjDLat(lng - 105.0, lat - 35.0);
    var dLng = gcjDLng(lng - 105.0, lat - 35.0);

    var radLat = lat / 180.0 * Math.PI;
    var magic = Math.sin(radLat);
    magic = 1 - GCJ_EE * magic * magic;
    var sqrtMagic = Math.sqrt(magic);

    dLat = (dLat * 180.0) / ((GCJ_A * (1 - GCJ_EE)) / (magic * sqrtMagic) * Math.PI);
    dLng = (dLng * 180.0) / (GCJ_A / sqrtMagic * Math.cos(radLat) * Math.PI);

    return { lat: lat + dLat, lng: lng + dLng };
  }

  // Inverse has no closed form; three refinement passes is plenty
  // (residual well under a metre).
  function gcj02ToWgs84(lat, lng) {
    if (outOfChina(lat, lng)) return { lat: lat, lng: lng };

    var wLat = lat, wLng = lng;
    for (var i = 0; i < 3; i++) {
      var g = wgs84ToGcj02(wLat, wLng);
      wLat += lat - g.lat;
      wLng += lng - g.lng;
    }
    return { lat: wLat, lng: wLng };
  }

  // Which layers are cut in GCJ-02
  var GCJ_LAYERS = { amap: 1, amapSat: 1 };

  function usesGcj() {
    return !!GCJ_LAYERS[state.layer];
  }

  // ============================================================
  //  Tile store
  //
  //  tileMap[key] = { img, z, x, y, ready }
  //  key = "z/x/y"
  //
  //  Tiles are positioned in ACTIVE-Z space. A tile from level
  //  (activeZ - 1) gets doubled in size, (activeZ + 1) halved.
  //  That lets one transform on the container scale everything.
  // ============================================================
  var tileMap = {};
  var activeZ = 4;       // the level currently being rendered

  // Levels kept underneath as a backdrop while the active level loads.
  // A set (not a single level) so that jumping several zoom levels at
  // once still has something to show instead of a blank screen.
  var backdropZ = {};
  var backdropTimer = null;

  // Tiles that scrolled out of view, parked until the view settles.
  // key -> timestamp when it stopped being needed
  var spareTiles = {};
  var tileSweepTimer = null;

  // ------------------------------------------------------------
  //  Render origin
  //
  //  World pixel coordinates at z18 are around 5.5e7. CSS transforms and
  //  GPU compositing use 32-bit floats, whose integers are only exact up
  //  to 2^24 (16.7 million). Feeding 5.5e7 into translate() makes the
  //  browser round the value, and tiles end up pushed off screen - that
  //  is the "zoomed in to a blank page" bug.
  //
  //  Fix: keep every number small. Tile offsetLeft and the container
  //  translate are both expressed relative to renderOrigin, which tracks
  //  the viewport and only moves in whole-tile steps. Every value stays
  //  within a few thousand pixels.
  // ------------------------------------------------------------
  var renderOrigin = { x: 0, y: 0, z: -1 };

  var stats = {
    tiles: 0,
    pending: 0,
    lastFillKey: ''
  };

  function tileUrl(layerKey, z, x, y) {
    var cfg = LAYERS[layerKey];

    // Clamp to the layer's native max. When the user zooms past it we keep
    // requesting the deepest level the source actually has and let the
    // renderer upscale it - a blurry tile beats a blank one.
    var nativeZ = Math.min(z, cfg.max || 18);
    var div = Math.pow(2, z - nativeZ);
    if (div > 1) {
      x = Math.floor(x / div);
      y = Math.floor(y / div);
    }

    var url = cfg.url
      .replace(/\{z\}/g, nativeZ)
      .replace(/\{x\}/g, x)
      .replace(/\{y\}/g, y);
    if (cfg.subdomains) {
      var s = cfg.subdomains[(x + y) % cfg.subdomains.length];
      url = url.replace(/\{s\}/g, s);
    }
    return url;
  }

  // Scale factor for a tile of level z when rendered at activeZ
  function tileScale(z) {
    return Math.pow(2, activeZ - z);
  }

  // ------------------------------------------------------------
  //  Tile load queue
  //
  //  Previously every visible tile was requested at once. A browser only
  //  opens ~6 connections per host, so a screenful of 40+ tiles queued up
  //  behind each other, and one slow host stalled everything. Requests
  //  are now issued through a small queue: centre-first, with a cap on
  //  how many are in flight. Tiles still waiting are simply blank; they
  //  fill in as slots free up.
  // ------------------------------------------------------------
  var MAX_INFLIGHT = 8;
  var TILE_TIMEOUT = 12000;   // give up on a tile after this long
  var inflight = 0;
  var pendingQueue = [];   // [{rec, url}]

  function queueTile(rec, url) {
    rec.url = url;
    pendingQueue.push(rec);
  }

  // Distance from the viewport centre, used to load the middle first.
  function queuePriority(rec) {
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    var s = tileScale(rec.z);
    var lt = viewLeftTop(activeZ);
    var sx = (rec.x * TILE * s - lt.left * s) / s;
    var sy = (rec.y * TILE * s - lt.top * s) / s;
    var dx = sx + TILE / 2 - vw / 2;
    var dy = sy + TILE / 2 - vh / 2;
    return dx * dx + dy * dy;
  }

  // How many parallel requests this layer wants. Overseas hosts are slow
  // per request, so they get a bigger budget to keep the wait reasonable.
  function inflightLimit() {
    var cfg = LAYERS[state.layer];
    return (cfg && cfg.maxInflight) || MAX_INFLIGHT;
  }

  function pumpQueue() {
    var limit = inflightLimit();
    if (inflight >= limit || pendingQueue.length === 0) return;

    // Re-sort so the tiles closest to the crosshair go first.
    if (pendingQueue.length > 1) {
      for (var i = 0; i < pendingQueue.length; i++) {
        pendingQueue[i]._p = queuePriority(pendingQueue[i]);
      }
      pendingQueue.sort(function (a, b) { return a._p - b._p; });
    }

    while (inflight < limit && pendingQueue.length) {
      var rec = pendingQueue.shift();

      // dropped while waiting (level changed, panned away, layer switched)
      if (!tileMap[rec.key] || tileMap[rec.key] !== rec) continue;
      if (rec.ready || rec.loading) continue;

      rec.loading = true;
      inflight++;
      rec.img.src = rec.url;

      // Watchdog: a stalled request would otherwise hold its slot forever
      // and the whole queue would crawl. Force it through the error path.
      (function (r) {
        if (r._wd) clearTimeout(r._wd);
        r._wd = setTimeout(function () {
          if (!r.ready && r.loading && tileMap[r.key] === r) {
            r.loading = false;
            if (inflight > 0) inflight--;
            if (r.tries < 1) {
              r.tries++;
              r.url = r.url + (r.url.indexOf('?') < 0 ? '?' : '&') + '_t=1';
              queueTile(r, r.url);
            } else {
              if (r.counted) { stats.pending--; r.counted = false; }
            }
            r.img.src = '';
            pumpQueue();
          }
        }, TILE_TIMEOUT);
      })(rec);
    }
  }

  function releaseSlot() {
    if (inflight > 0) inflight--;
    pumpQueue();
  }

  function createTile(z, x, y) {
    var key = z + '/' + x + '/' + y;
    if (tileMap[key]) return;

    var maxIdx = Math.pow(2, z) - 1;
    var wx = ((x % (maxIdx + 1)) + (maxIdx + 1)) % (maxIdx + 1);

    var img = document.createElement('img');
    img.alt = '';
    img.decoding = 'async';
    // 'lazy' keeps the browser from racing us; the queue decides order.
    img.loading = 'lazy';
    // NOTE: do NOT set crossOrigin here. Tile servers such as Amap do not
    // send CORS headers, and requesting the image with crossOrigin makes
    // the load fail outright - which shows up as a blank map after zooming.
    // crossOrigin is only needed when reading pixels back through canvas.

    var rec = {
      img: img, z: z, x: x, y: y, key: key,
      ready: false, loading: false, tries: 0, url: '',
      counted: true          // still counted in stats.pending
    };
    tileMap[key] = rec;
    stats.pending++;

    var url = tileUrl(state.layer, z, wx, y);

    attachTileHandlers(rec);

    // position in activeZ space, relative to renderOrigin (keeps it small)
    placeTile(rec);

    queueTile(rec, url);

    tilesBox.appendChild(img);
    stats.tiles++;
  }

  // Bind load/error handlers for a tile record. Extracted so a layer
  // switch can detach, clear src, and re-arm without losing state.
  function attachTileHandlers(rec) {
    var img = rec.img;
    var url = rec.url || '';

    img.onload = function () {
      rec.ready = true;
      rec.loading = false;
      if (rec._wd) { clearTimeout(rec._wd); rec._wd = null; }
      if (rec.counted) { stats.pending--; rec.counted = false; }
      img.classList.add('ready');
      releaseSlot();
      maybeDropPrevLevel();
      maybeHideLoader();
    };

    img.onerror = function () {
      rec.loading = false;
      if (rec._wd) { clearTimeout(rec._wd); rec._wd = null; }

      // one quiet retry - transient timeouts are common on flaky links
      if (rec.tries < 1) {
        rec.tries++;
        var base = rec.url || url;
        var retryUrl = base + (base.indexOf('?') < 0 ? '?' : '&') + '_r=' + rec.tries;
        setTimeout(function () {
          if (tileMap[rec.key] === rec) {
            rec.url = retryUrl;
            queueTile(rec, retryUrl);
            pumpQueue();
          }
        }, 500 + Math.random() * 800);
        releaseSlot();
        return;
      }

      if (rec.counted) { stats.pending--; rec.counted = false; }
      img.classList.remove('ready');
      releaseSlot();
      maybeHideLoader();
    };
  }

  // Put a tile at its position relative to renderOrigin.
  //
  //  mult = 2^(activeZ - rec.z): how much this tile is enlarged to fit the
  //         active level (backdrop tiles are 2x, 4x ...)
  //
  //  left = activeZ position (rec.x * TILE * mult) - renderOrigin
  //
  //  renderOrigin must NOT be multiplied by mult - it already lives in
  //  activeZ space. Multiplying it too pushed every backdrop tile to roughly
  //  double its correct offset, which dragged the old layer left while
  //  zooming.
  function placeTile(rec) {
    var mult = tileScale(rec.z);
    var sz = TILE * mult;
    var px = rec.x * TILE * mult - renderOrigin.x;
    var py = rec.y * TILE * mult - renderOrigin.y;
    rec.img.style.left = px + 'px';
    rec.img.style.top = py + 'px';
    rec.img.style.width = sz + 'px';
    rec.img.style.height = sz + 'px';
  }

  function removeTile(key) {
    var rec = tileMap[key];
    if (!rec) return;

    if (rec.counted) { stats.pending--; rec.counted = false; }

    // If it was queued but not started, drop it from the queue.
    // If it was already in flight, free the slot.
    for (var i = pendingQueue.length - 1; i >= 0; i--) {
      if (pendingQueue[i] === rec) pendingQueue.splice(i, 1);
    }
    if (rec.loading) {
      rec.loading = false;
      if (inflight > 0) inflight--;
    }

    if (rec.img.parentNode) rec.img.parentNode.removeChild(rec.img);
    rec.img.onload = null;
    rec.img.onerror = null;
    // release the bitmap
    rec.img.src = '';
    delete tileMap[key];
    stats.tiles--;
    pumpQueue();
  }

  function removeLevel(z) {
    var keys = Object.keys(tileMap);
    for (var i = 0; i < keys.length; i++) {
      if (tileMap[keys[i]] && tileMap[keys[i]].z === z) removeTile(keys[i]);
    }
  }

  // Reposition every existing tile after activeZ or renderOrigin changes
  function relayoutTiles() {
    for (var k in tileMap) {
      if (!tileMap.hasOwnProperty(k)) continue;
      placeTile(tileMap[k]);
    }
  }

  // ============================================================
  //  Render origin maintenance
  // ============================================================

  // state.center is WGS-84 world pixels. Amap layers must be drawn in
  // GCJ-02, so shift the centre before computing any world pixel for them.
  function centerInLayer() {
    if (!usesGcj()) return state.center;

    var lat = worldYToLat(state.center.y, state.zoom);
    var lng = worldXToLng(state.center.x, state.zoom);
    var g = wgs84ToGcj02(lat, lng);

    return {
      x: lngToWorldX(g.lng, state.zoom),
      y: latToWorldY(g.lat, state.zoom)
    };
  }

  function viewLeftTop(z) {
    var ratio = Math.pow(2, z - state.zoom);
    var c = centerInLayer();
    var cx = c.x * ratio;
    var cy = c.y * ratio;
    return {
      left: cx - viewport.clientWidth / 2,
      top: cy - viewport.clientHeight / 2
    };
  }

  // Keep renderOrigin within one tile of the viewport corner, in whole-tile
  // steps so tiles do not jitter. Returns true when it moved (caller must
  // relayout).
  function ensureOrigin(z) {
    var lt = viewLeftTop(z);
    var ox = Math.floor(lt.left / TILE) * TILE - TILE;
    var oy = Math.floor(lt.top / TILE) * TILE - TILE;

    if (renderOrigin.z === z &&
        Math.abs(renderOrigin.x - ox) < TILE &&
        Math.abs(renderOrigin.y - oy) < TILE) {
      return false;
    }

    renderOrigin.x = ox;
    renderOrigin.y = oy;
    renderOrigin.z = z;
    return true;
  }

  // ============================================================
  //  Viewport math
  // ============================================================
  function viewRect(z) {
    var vw = viewport.clientWidth;
    var vh = viewport.clientHeight;
    var ratio = Math.pow(2, z - state.zoom);
    var c = centerInLayer();
    var cx = c.x * ratio;
    var cy = c.y * ratio;
    var left = cx - vw / 2;
    var top = cy - vh / 2;

    return {
      z: z,
      left: left,
      top: top,
      vw: vw,
      vh: vh,
      x0: Math.floor(left / TILE) - PAD,
      y0: Math.floor(top / TILE) - PAD,
      x1: Math.floor((left + vw - 1) / TILE) + PAD,
      y1: Math.floor((top + vh - 1) / TILE) + PAD
    };
  }

  // ============================================================
  //  Fill the active level
  // ============================================================
  var lastRect = null;

  function needsFill(r) {
    if (!lastRect) return true;
    if (lastRect.z !== r.z) return true;
    if (r.x0 < lastRect.x0 || r.x1 > lastRect.x1) return true;
    if (r.y0 < lastRect.y0 || r.y1 > lastRect.y1) return true;
    return false;
  }

  function fillTiles() {
    var z = activeZ;

    // Keep renderOrigin close to the viewport before placing anything.
    // If it moved, every existing tile needs a new offset AND the old
    // range check is meaningless, so force a refill.
    if (ensureOrigin(z)) {
      lastRect = null;
      relayoutTiles();
    }

    var r = viewRect(z);

    if (!needsFill(r)) return;
    lastRect = r;

    var maxIdx = Math.pow(2, z) - 1;
    var need = {};

    for (var tx = r.x0; tx <= r.x1; tx++) {
      for (var ty = r.y0; ty <= r.y1; ty++) {
        if (ty < 0 || ty > maxIdx) continue;
        need[z + '/' + tx + '/' + ty] = true;
        createTile(z, tx, ty);
      }
    }

    // Tiles of the active level that scrolled out of view are NOT removed
    // immediately. During a fast pan the old tiles are the only thing on
    // screen until the new ones arrive, so deleting them right away is
    // what produced the blank flashes. Instead they are parked in a
    // "recently used" set and swept later (see scheduleTileSweep).
    var keys = Object.keys(tileMap);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      var rec = tileMap[k];
      if (!rec) continue;
      if (rec.z === z) {
        if (need[k]) {
          delete spareTiles[k];
        } else {
          // keep it around, but remember that it is no longer needed
          spareTiles[k] = Date.now();
        }
      } else if (!backdropZ[rec.z]) {
        removeTile(k);
      }
    }

    scheduleTileSweep();
    pumpQueue();
  }

  // Parked tiles are released only after the view has settled, so a
  // fast pan always has something to draw underneath.
  //
  // Note the re-arm: a single pass can skip tiles that were parked less
  // than GRACE ms ago, and without rescheduling those skipped tiles would
  // never be released (a fast drag left 300+ tiles in the DOM).
  var SWEEP_GRACE = 1200;

  function scheduleTileSweep() {
    if (tileSweepTimer) clearTimeout(tileSweepTimer);
    tileSweepTimer = setTimeout(runTileSweep, 900);
  }

  function runTileSweep() {
    tileSweepTimer = null;

    // Active level still loading? Keep everything and try again later.
    if (activeReadyRatio() < 0.9) {
      scheduleTileSweep();
      return;
    }

    var now = Date.now();
    var remaining = 0;

    for (var k in spareTiles) {
      if (!spareTiles.hasOwnProperty(k)) continue;
      if (now - spareTiles[k] < SWEEP_GRACE) {
        remaining++;
        continue;
      }
      removeTile(k);
      delete spareTiles[k];
    }

    // Some tiles were still inside the grace window; come back for them.
    if (remaining > 0) scheduleTileSweep();
  }

  // ============================================================
  //  Transform the whole tile container (single GPU op)
  //
  //  Tiles inside the container are placed at (world - renderOrigin).
  //  So the container only has to make up the difference between
  //  renderOrigin and the viewport corner:
  //     screen = (world - renderOrigin) * s + (renderOrigin - left) * s
  //            = (world - left) * s
  //  and (renderOrigin - left) is at most a couple of tiles, so the
  //  translate stays small and keeps full float32 precision.
  // ============================================================
  function applyTransform() {
    var z = activeZ;
    var s = Math.pow(2, state.zoom - z);

    var lt = viewLeftTop(z);

    var px = (renderOrigin.x - lt.left) * s;
    var py = (renderOrigin.y - lt.top) * s;

    tilesBox.style.transform =
      'translate3d(' + px.toFixed(2) + 'px,' + py.toFixed(2) + 'px,0) scale(' + s.toFixed(4) + ')';
  }

  // ============================================================
  //  Level switching
  //
  //  Key performance idea: when zoom crosses an integer level we
  //  build the NEW level and keep the OLD one underneath as a
  //  backdrop. Nothing is torn down until the new level has
  //  loaded, so there is no white flash and no visible rebuild.
  // ============================================================
  function switchLevel(z) {
    if (z === activeZ) return;

    // demote the current level to backdrop instead of dropping it
    backdropZ[activeZ] = true;

    activeZ = z;
    lastRect = null;   // force a refill for the new level
    renderOrigin.z = -1;   // origin is level-specific, rebuild it

    relayoutTiles();
    scheduleBackdropSweep();
    pruneBackdrops();
  }

  // How much of the active level has actually loaded
  function activeReadyRatio() {
    var total = 0, ready = 0;
    for (var k in tileMap) {
      if (!tileMap.hasOwnProperty(k)) continue;
      if (tileMap[k].z !== activeZ) continue;
      total++;
      if (tileMap[k].ready) ready++;
    }
    if (total === 0) return 0;
    return ready / total;
  }

  // Drop backdrop levels once the active level is mostly visible.
  // Never drop them while the active level is still mostly empty -
  // that is exactly what produced the blank map after zooming.
  function pruneBackdrops() {
    if (activeReadyRatio() < 0.85) return;

    for (var z in backdropZ) {
      if (!backdropZ.hasOwnProperty(z)) continue;
      removeLevel(parseInt(z, 10));
      delete backdropZ[z];
    }

    if (backdropTimer) {
      clearTimeout(backdropTimer);
      backdropTimer = null;
    }
  }

  // Safety net: if the active level is still not ready after a long
  // while, keep at most one backdrop and drop the rest, so memory
  // cannot grow without bound.
  function scheduleBackdropSweep() {
    if (backdropTimer) clearTimeout(backdropTimer);
    backdropTimer = setTimeout(function () {
      backdropTimer = null;
      if (activeReadyRatio() >= 0.85) {
        pruneBackdrops();
        return;
      }
      var levels = Object.keys(backdropZ);
      // keep the newest backdrop only
      for (var i = 0; i < levels.length; i++) {
        var lz = parseInt(levels[i], 10);
        if (lz !== activeZ - 1 && lz !== activeZ + 1) {
          removeLevel(lz);
          delete backdropZ[levels[i]];
        }
      }
    }, 15000);
  }

  function maybeDropPrevLevel() {
    if (activeReadyRatio() >= 0.85) pruneBackdrops();
  }

  // ============================================================
  //  Render scheduling
  // ============================================================
  var rafPending = false;

  function requestRender(forceFill) {
    if (rafPending) return;
    rafPending = true;

    requestAnimationFrame(function () {
      rafPending = false;

      var z = Math.round(state.zoom);
      z = Math.max(MIN_Z, Math.min(MAX_Z, z));

      if (z !== activeZ) switchLevel(z);

      // Always call fillTiles. It is cheap when nothing changed (needsFill
      // bails out after a few comparisons) and, crucially, this is the only
      // path that adds tiles while panning. Gating it behind a "fill
      // requested" flag meant dragging never loaded anything new.
      fillTiles();
      applyTransform();
    });
  }

  // ============================================================
  //  Loader / toast
  // ============================================================
  var loaderHidden = false;
  function maybeHideLoader() {
    if (loaderHidden) return;
    if (stats.tiles === 0) return;
    loaderHidden = true;
    loader.classList.add('hide');
  }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 1600);
  }

  // ============================================================
  //  Layer availability watchdog
  //
  //  Some Esri layers return a valid-looking 2.5 KB "Map data not yet
  //  available" placeholder for China instead of a 404, so they load
  //  without error yet show nothing. Rather than leave the user staring
  //  at a grey screen, watch the active level after a switch and warn
  //  when almost nothing came back.
  // ============================================================
  var availTimer = null;

  function watchLayerAvailability(key) {
    if (availTimer) clearTimeout(availTimer);

    availTimer = setTimeout(function () {
      availTimer = null;
      if (state.layer !== key) return;

      var total = 0, ready = 0;
      for (var k in tileMap) {
        if (!tileMap.hasOwnProperty(k)) continue;
        if (tileMap[k].z !== activeZ) continue;
        total++;
        if (tileMap[k].ready) ready++;
      }

      // nothing loaded at all, or the queue is stuck -> tell the user
      if (total > 0 && ready / total < 0.35) {
        toast(lang === 'zh'
          ? '\u8fd9\u4e2a\u56fe\u5c42\u5728\u6b64\u533a\u57df\u53ef\u80fd\u6ca1\u6709\u6570\u636e'
          : 'This layer may have no data here');
      }
    }, 5000);
  }

  // ============================================================
  //  View helpers
  // ============================================================
  function setView(lat, lng, zoom) {
    state.zoom = Math.max(MIN_Z, Math.min(MAX_Z, zoom));
    state.center.x = lngToWorldX(lng, state.zoom);
    state.center.y = latToWorldY(lat, state.zoom);

    // rebuild the tile level from scratch
    var keys = Object.keys(tileMap);
    for (var i = 0; i < keys.length; i++) removeTile(keys[i]);
    backdropZ = {};
    activeZ = Math.round(state.zoom);
    lastRect = null;
    renderOrigin.z = -1;

    updateLabels();
    requestRender(true);
  }

  // ============================================================
  //  Coordinate formatting
  //
  //  Bare decimals like "24.47980, 118.08940" are ambiguous at a glance:
  //  nothing tells you which number is latitude and which hemisphere.
  //  Everything is printed with a hemisphere letter instead.
  // ============================================================
  function fmtLat(v) {
    return Math.abs(v).toFixed(5) + '\u00b0 ' + (v >= 0 ? 'N' : 'S');
  }
  function fmtLng(v) {
    return Math.abs(v).toFixed(5) + '\u00b0 ' + (v >= 0 ? 'E' : 'W');
  }

  function updateLabels() {
    var lat = worldYToLat(state.center.y, state.zoom);
    var lng = worldXToLng(state.center.x, state.zoom);
    document.getElementById('c-lat').textContent = fmtLat(lat);
    document.getElementById('c-lng').textContent = fmtLng(lng);
    zoomLabel.textContent =
      (typeof lang !== 'undefined' && lang === 'zh' ? '\u7f29\u653e ' : 'Zoom ') +
      state.zoom.toFixed(1);
    // keep the cursor/centre readout in sync after any view change
    if (typeof renderCursor === 'function') renderCursor();
  }

  // ============================================================
  //  Screen -> lon/lat
  //
  //  A screen point maps back to the world through the same transform
  //  chain used for rendering:
  //     screen = (world - lt.left) * s
  //  so world = screen / s + lt.left
  // ============================================================
  function screenToLatLng(px, py) {
    var z = activeZ;
    var s = Math.pow(2, state.zoom - z);
    var lt = viewLeftTop(z);
    var wx = px / s + lt.left;
    var wy = py / s + lt.top;

    var lat = worldYToLat(wy, z);
    var lng = worldXToLng(wx, z);

    // Amap layers are drawn in GCJ-02; hand back WGS-84 like everything else.
    if (usesGcj()) {
      var w = gcj02ToWgs84(lat, lng);
      return { lat: w.lat, lng: w.lng };
    }
    return { lat: lat, lng: lng };
  }

  // Zoom always happens around the crosshair at the viewport centre.
  // Anchoring on the mouse pointer meant the point under the cursor stayed
  // put while everything else slid away, which is disorienting when the
  // crosshair is what marks your position. With a centre anchor the ground
  // under the crosshair is invariant, so the map grows/shrinks in place.
  function zoomBy(delta) {
    var oldZoom = state.zoom;
    var newZoom = Math.max(MIN_Z, Math.min(MAX_Z, oldZoom + delta));
    if (newZoom === oldZoom) return;

    // state.center is stored in world pixels AT the current zoom level, so
    // the stored value has to be rescaled together with the level. Without
    // this the centre would jump to a completely different place.
    var ratio = Math.pow(2, newZoom - oldZoom);
    state.center.x *= ratio;
    state.center.y *= ratio;
    state.zoom = newZoom;

    updateLabels();
    requestRender();
  }

  // ============================================================
  //  Drag
  // ============================================================
  var dragging = false;
  var dragStart = null;

  viewport.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    dragging = true;
    dragStart = {
      x: e.clientX, y: e.clientY,
      cx: state.center.x, cy: state.center.y
    };
    viewport.classList.add('dragging');
    e.preventDefault();
  });

  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - dragStart.x;
    var dy = e.clientY - dragStart.y;
    state.center.x = dragStart.cx - dx;
    state.center.y = dragStart.cy - dy;
    updateLabels();
    requestRender();
  });

  window.addEventListener('mouseup', function () {
    if (!dragging) return;
    dragging = false;
    viewport.classList.remove('dragging');
  });

  // ============================================================
  //  Touch
  // ============================================================
  var touchState = null;

  viewport.addEventListener('touchstart', function (e) {
    if (e.touches.length === 1) {
      var t = e.touches[0];
      touchState = {
        mode: 'pan',
        x: t.clientX, y: t.clientY,
        cx: state.center.x, cy: state.center.y
      };
    } else if (e.touches.length === 2) {
      var t1 = e.touches[0], t2 = e.touches[1];
      touchState = {
        mode: 'pinch',
        dist: Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY),
        zoom: state.zoom,
        midX: (t1.clientX + t2.clientX) / 2,
        midY: (t1.clientY + t2.clientY) / 2
      };
    }
    e.preventDefault();
  }, { passive: false });

  viewport.addEventListener('touchmove', function (e) {
    if (!touchState) return;
    if (touchState.mode === 'pan' && e.touches.length === 1) {
      var t = e.touches[0];
      state.center.x = touchState.cx - (t.clientX - touchState.x);
      state.center.y = touchState.cy - (t.clientY - touchState.y);
      updateLabels();
      requestRender();
    } else if (touchState.mode === 'pinch' && e.touches.length === 2) {
      var t1 = e.touches[0], t2 = e.touches[1];
      var d = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      var ratio = d / touchState.dist;
      var targetZoom = touchState.zoom + Math.log2(ratio);
      targetZoom = Math.max(MIN_Z, Math.min(MAX_Z, targetZoom));
      var dz = targetZoom - state.zoom;
      if (Math.abs(dz) > 0.02) zoomBy(dz);   // pivots on the crosshair
    }
    e.preventDefault();
  }, { passive: false });

  viewport.addEventListener('touchend', function (e) {
    if (e.touches.length === 0) {
      touchState = null;
    } else if (e.touches.length === 1) {
      var t = e.touches[0];
      touchState = {
        mode: 'pan',
        x: t.clientX, y: t.clientY,
        cx: state.center.x, cy: state.center.y
      };
    }
  });

  // ---- wheel zoom ----
  // Accumulate wheel deltas and apply them on the next frame.
  // This keeps a fast scroll wheel from firing dozens of renders.
  // The zoom pivots on the centre crosshair, not the pointer.
  var wheelAccum = 0;
  var wheelRaf = false;

  viewport.addEventListener('wheel', function (e) {
    e.preventDefault();

    var step = e.deltaMode === 1 ? 0.25 : 0.15;
    wheelAccum += (e.deltaY > 0 ? -step : step);

    if (wheelRaf) return;
    wheelRaf = true;
    requestAnimationFrame(function () {
      wheelRaf = false;
      var d = wheelAccum;
      wheelAccum = 0;
      if (Math.abs(d) < 0.01) return;
      // clamp a single frame's jump
      if (d > 1) d = 1;
      if (d < -1) d = -1;
      zoomBy(d);
    });
  }, { passive: false });

  // ---- double click zoom ----
  viewport.addEventListener('dblclick', function (e) {
    zoomBy(1);
  });

  // ============================================================
  //  Buttons
  // ============================================================
  document.getElementById('zoomIn').addEventListener('click', function () { zoomBy(1); });
  document.getElementById('zoomOut').addEventListener('click', function () { zoomBy(-1); });
  document.getElementById('btnReset').addEventListener('click', function () {
    setView(HOME.lat, HOME.lng, HOME.zoom);
    toast(t('viewReset'));
  });

  // Jump straight to the user's own neighbourhood at street level.
  document.getElementById('btnLocate').addEventListener('click', function () {
    if (!navigator.geolocation) {
      toast(t('noGeo'));
      return;
    }
    toast(t('locating'));
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        setView(pos.coords.latitude, pos.coords.longitude, 17);
        toast(t('located'));
      },
      function () {
        toast(t('locateFail'));
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
    );
  });

  // ============================================================
  //  Cursor readout + bookmarks
  //
  //  Bookmarks are kept in a plain array on purpose. There is no
  //  localStorage / IndexedDB anywhere in this page, so a refresh or a
  //  reopened tab starts with an empty list - exactly as requested.
  // ============================================================
  var M_LAT = document.getElementById('m-lat');
  var M_LNG = document.getElementById('m-lng');
  var bmBox = document.getElementById('bookmarks');
  var bmList = document.getElementById('bm-list');
  var bmCount = document.getElementById('bm-count');

  var bookmarks = [];          // [{ lat, lng, zoom }]
  var cursorLL = null;         // last lon/lat under the pointer

  // True when the keystroke belongs to a form field rather than the map.
  function isTyping(e) {
    var t = e.target;
    if (!t) return false;
    var tag = t.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable;
  }

  function renderCursor() {
    if (cursorLL) {
      M_LAT.textContent = fmtLat(cursorLL.lat);
      M_LNG.textContent = fmtLng(cursorLL.lng);
    } else {
      // pointer outside the map: fall back to the view centre
      M_LAT.textContent = fmtLat(worldYToLat(state.center.y, state.zoom));
      M_LNG.textContent = fmtLng(worldXToLng(state.center.x, state.zoom));
    }
  }

  viewport.addEventListener('mousemove', function (e) {
    var r = viewport.getBoundingClientRect();
    cursorLL = screenToLatLng(e.clientX - r.left, e.clientY - r.top);
    renderCursor();
  });

  viewport.addEventListener('mouseleave', function () {
    cursorLL = null;
    renderCursor();
  });

  // ---- bookmarks ----
  function renderBookmarks() {
    bmCount.textContent = bookmarks.length;

    if (bookmarks.length === 0) {
      bmBox.classList.remove('show');
      bmList.innerHTML = '';
      return;
    }

    bmBox.classList.add('show');
    var html = '';
    for (var i = 0; i < bookmarks.length; i++) {
      var b = bookmarks[i];
      html +=
        '<div class="bm-item" data-i="' + i + '">' +
          '<div class="bm-idx">' + (i + 1) + '</div>' +
          '<div class="bm-body">' +
            '<div class="bm-name">' + b.lat.toFixed(4) + ', ' + b.lng.toFixed(4) + '</div>' +
            '<div class="bm-coord">z' + b.zoom.toFixed(1) + '</div>' +
          '</div>' +
          '<button class="bm-del" data-del="' + i + '" title="Remove">&times;</button>' +
        '</div>';
    }
    bmList.innerHTML = html;

    bmList.querySelectorAll('.bm-item').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.classList.contains('bm-del')) return;   // delete handled below
        var b = bookmarks[parseInt(this.getAttribute('data-i'), 10)];
        if (!b) return;
        setView(b.lat, b.lng, b.zoom);
        toast(t('jumpSaved'));
      });
    });

    bmList.querySelectorAll('.bm-del').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var i = parseInt(this.getAttribute('data-del'), 10);
        bookmarks.splice(i, 1);
        renderBookmarks();
        toast(t('removed'));
      });
    });
  }

  function saveCurrentPoint() {
    // Prefer the point under the pointer; fall back to the view centre.
    var lat, lng;
    if (cursorLL) {
      lat = cursorLL.lat;
      lng = cursorLL.lng;
    } else {
      lat = worldYToLat(state.center.y, state.zoom);
      lng = worldXToLng(state.center.x, state.zoom);
    }

    // ignore an accidental duplicate of the previous save
    var last = bookmarks[bookmarks.length - 1];
    if (last && Math.abs(last.lat - lat) < 1e-6 && Math.abs(last.lng - lng) < 1e-6) {
      toast(t('alreadySaved'));
      return;
    }

    bookmarks.push({ lat: lat, lng: lng, zoom: state.zoom });
    renderBookmarks();
    toast(t('saved') + ' #' + bookmarks.length);
  }

  document.getElementById('btnSave').addEventListener('click', saveCurrentPoint);

  // ============================================================
  //  Coordinate jump
  //
  //  Accepts the shapes people actually paste:
  //     13.584, 144.924
  //     13.584N, 144.924E
  //     -13.584 -144.924
  //     13.584 144.924
  // ============================================================
  var gotoInput = document.getElementById('gotoInput');

  function parseCoordPair(str) {
    if (!str) return null;

    var s = String(str)
      .replace(/[°度]/g, ' ')
      .replace(/[′']/g, ' ')
      .replace(/[″"]/g, ' ');

    var m = s.match(/(-?\d+(?:\.\d+)?)\s*([NSEWnsew]?)[,\s]+(-?\d+(?:\.\d+)?)\s*([NSEWnsew]?)/);
    if (!m) return null;

    var lat = parseFloat(m[1]);
    var lng = parseFloat(m[3]);
    var a = (m[2] || '').toUpperCase();
    var b = (m[4] || '').toUpperCase();

    if (a === 'S') lat = -Math.abs(lat);
    if (b === 'W') lng = -Math.abs(lng);

    if (!isFinite(lat) || !isFinite(lng)) return null;
    // Web Mercator cannot represent beyond ~85 degrees
    if (lat < -85 || lat > 85) return null;
    if (lng < -180 || lng > 180) return null;

    return { lat: lat, lng: lng };
  }

  function doGoto() {
    var v = parseCoordPair(gotoInput.value);
    if (!v) {
      gotoInput.classList.add('bad');
      toast(t('badCoord'));
      return;
    }
    gotoInput.classList.remove('bad');

    // No automatic layer switching: the user picks the layer themselves.
    // The hint in the top-right corner explains which source to use where.
    toast(fmtLat(v.lat) + '   ' + fmtLng(v.lng));

    setView(v.lat, v.lng, 16);
  }

  gotoInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      doGoto();
    } else if (e.key === 'Escape') {
      this.blur();
      this.classList.remove('bad');
    }
  });

  gotoInput.addEventListener('input', function () {
    this.classList.remove('bad');
  });

  // Ctrl+D / Cmd+D saves the point under the cursor
  window.addEventListener('keydown', function (e) {
    // never hijack keys while the coordinate box has focus
    if (isTyping(e)) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) {
      e.preventDefault();
      saveCurrentPoint();
    }
  });

  renderCursor();
  renderBookmarks();

  // ============================================================
  //  Language
  //
  //  Two dictionaries, one switch. The Chinese side is written by hand
  //  rather than translated word-for-word, so it reads like something a
  //  Chinese speaker would actually put on a map UI.
  // ============================================================
  var I18N = {
    en: {
      layers: 'Layers',
      reset: 'Reset',
      resetTip: 'Back to the starting view',
      locate: 'Locate',
      locateTip: 'Jump to my location',
      save: 'Save',
      saveTip: 'Bookmark the point under the crosshair (Ctrl+D)',
      gotoPh: 'lat, lon   e.g. 13.58,144.92',
      gotoTip: 'Paste coordinates, press Enter',
      zoomIn: 'Zoom in',
      zoomOut: 'Zoom out',
      cursor: 'Cursor',
      center: 'Center',
      loading: 'Loading map...',
      saved: 'Saved',
      savedTitle: 'Bookmarks',
      emptyList: 'Nothing saved yet',
      layerLabel: 'Layer',
      needAmap: 'Inside China \u2192 Amap',
      needEsri: 'Overseas \u2192 Esri',
      switchManually: 'Switch manually',
      removed: 'Removed',
      alreadySaved: 'Already saved',
      viewReset: 'View reset',
      locating: 'Locating...',
      located: 'Got it - zoom in for detail',
      locateFail: 'Location unavailable',
      badCoord: 'Format: 13.584, 144.924',
      noGeo: 'Geolocation not supported',
      jumpSaved: 'Jumped to saved point'
    },
    zh: {
      layers: '\u56fe\u5c42',
      reset: '\u56de\u5230\u8d77\u70b9',
      resetTip: '\u8fd4\u56de\u521d\u59cb\u89c6\u89d2',
      locate: '\u5b9a\u4f4d',
      locateTip: '\u8df3\u5230\u6211\u7684\u4f4d\u7f6e',
      save: '\u6536\u85cf',
      saveTip: '\u628a\u51c6\u5fc3\u5904\u7684\u70b9\u5b58\u8d77\u6765\uff08Ctrl+D\uff09',
      gotoPh: '\u7ecf\u7eac\u5ea6  \u5982 13.58,144.92',
      gotoTip: '\u7c98\u8d34\u5750\u6807\u540e\u56de\u8f66',
      zoomIn: '\u653e\u5927',
      zoomOut: '\u7f29\u5c0f',
      cursor: '\u9f20\u6807',
      center: '\u5c4f\u5e55\u4e2d\u5fc3',
      loading: '\u5730\u56fe\u52a0\u8f7d\u4e2d\u2026',
      saved: '\u5df2\u5b58',
      savedTitle: '\u6536\u85cf\u5939',
      emptyList: '\u8fd8\u6ca1\u6709\u6536\u85cf',
      layerLabel: '\u5f53\u524d\u56fe\u5c42',
      needAmap: '\u56fd\u5185\u7528\u9ad8\u5fb7',
      needEsri: '\u5883\u5916\u7528 Esri',
      switchManually: '\u9700\u8981\u624b\u52a8\u5207\u6362',
      removed: '\u5df2\u5220\u9664',
      alreadySaved: '\u5df2\u7ecf\u5b58\u8fc7\u4e86',
      viewReset: '\u5df2\u56de\u5230\u8d77\u70b9',
      locating: '\u6b63\u5728\u5b9a\u4f4d\u2026',
      located: '\u5230\u4e86\uff0c\u653e\u5927\u770b\u7ec6\u8282',
      locateFail: '\u5b9a\u4f4d\u5931\u8d25',
      badCoord: '\u683c\u5f0f\uff1a13.584, 144.924',
      noGeo: '\u6d4f\u89c8\u5668\u4e0d\u652f\u6301\u5b9a\u4f4d',
      jumpSaved: '\u5df2\u8df3\u5230\u6536\u85cf\u70b9'
    }
  };

  var lang = 'en';

  function t(key) {
    return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  }

  function applyLanguage() {
    document.documentElement.lang = (lang === 'zh' ? 'zh-CN' : 'en');

    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-title]').forEach(function (el) {
      el.title = t(el.getAttribute('data-i18n-title'));
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
      el.placeholder = t(el.getAttribute('data-i18n-ph'));
    });

    document.getElementById('btnLang').textContent = (lang === 'zh' ? 'English' : '\u4e2d\u6587');
    document.getElementById('bm-title').textContent = t('savedTitle');
    document.getElementById('zoomLabel').textContent =
      (lang === 'zh' ? '\u7f29\u653e ' : 'Zoom ') + state.zoom.toFixed(1);

    renderLayerList();
    renderBookmarks();
  }

  document.getElementById('btnLang').addEventListener('click', function () {
    lang = (lang === 'zh' ? 'en' : 'zh');
    applyLanguage();
    // refresh the zoom label / readouts in the new language
    updateLabels();
  });

  // ============================================================
  //  Layer switching
  // ============================================================
  function layerName(key) {
    var cfg = LAYERS[key];
    if (!cfg) return key;
    return (lang === 'zh' && cfg.nameZh) ? cfg.nameZh : cfg.name;
  }
  function layerNote(key) {
    var cfg = LAYERS[key];
    if (!cfg) return '';
    return (lang === 'zh' && cfg.noteZh) ? cfg.noteZh : cfg.note;
  }

  // Build the layer panel from LAYERS so the bilingual names and the
  // one-line notes stay in sync with the data.
  function renderLayerList() {
    var box = document.getElementById('layerList');
    var fast = '', slow = '';

    for (var key in LAYERS) {
      if (!LAYERS.hasOwnProperty(key)) continue;
      var btn =
        '<button data-layer="' + key + '"' +
        (key === state.layer ? ' class="on"' : '') + '>' +
          '<span class="ln">' + layerName(key) + '</span>' +
          '<span class="ld">' + layerNote(key) + '</span>' +
        '</button>';
      if (LAYERS[key].slow) slow += btn;
      else fast += btn;
    }

    // Slow layers live behind a separator so it is obvious they are a
    // deliberate second choice, not the recommended default.
    var html = fast;
    if (slow) {
      html += '<div class="slowsep">' +
              (lang === 'zh' ? '\u8f83\u6162\u56fe\u5c42' : 'Slower layers') +
              '</div>' + slow;
    }

    html +=
      '<div class="hint">' +
        '<div class="row"><b>&#127464;&#127475; ' + t('needAmap') + '</b></div>' +
        '<div class="row"><b>&#127758; ' + t('needEsri') + '</b></div>' +
        '<span>' + t('switchManually') + '</span>' +
      '</div>';

    box.innerHTML = html;

    box.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        switchLayer(this.getAttribute('data-layer'));
      });
    });
  }

  function updateLayerUI(key) {
    document.querySelectorAll('#layerList button').forEach(function (x) {
      x.classList.toggle('on', x.getAttribute('data-layer') === key);
    });
    document.getElementById('credit').innerHTML = LAYERS[key].credit;
  }

  function switchLayer(key, quiet) {
    if (!LAYERS[key] || key === state.layer) return false;

    var datumChanged = (!!GCJ_LAYERS[key] !== !!GCJ_LAYERS[state.layer]);
    state.layer = key;

    if (datumChanged) {
      // The tile x/y indices were computed in the old datum. Reusing them
      // would just re-fetch the same tiles, which is exactly what made the
      // Amap layer look unshifted. Throw the grid away and rebuild it.
      var keys = Object.keys(tileMap);
      for (var i = 0; i < keys.length; i++) removeTile(keys[i]);
      backdropZ = {};
      lastRect = null;
      renderOrigin.z = -1;
    } else {
      // Same datum: just swap the image sources, no rebuild needed.
      // Go through the queue too, otherwise switching layers would fire
      // dozens of requests at once and stall.
      var keys2 = Object.keys(tileMap);
      for (var j = 0; j < keys2.length; j++) {
        var rec = tileMap[keys2[j]];
        if (!rec) continue;
        var maxIdx = Math.pow(2, rec.z) - 1;
        var wx = ((rec.x % (maxIdx + 1)) + (maxIdx + 1)) % (maxIdx + 1);

        // Detach handlers BEFORE clearing src. Assigning src='' fires the
        // error event synchronously in some browsers, which used to wipe
        // rec.ready and leave the whole level stuck at ratio 0.
        rec.img.onload = null;
        rec.img.onerror = null;
        rec.img.src = '';
        rec.img.classList.remove('ready');

        rec.ready = false;
        rec.loading = false;
        rec.tries = 0;
        rec.url = tileUrl(key, rec.z, wx, rec.y);

        // re-arm the handlers for the new source
        attachTileHandlers(rec);
        queueTile(rec, rec.url);

        // this tile is loading again, so it counts towards pending once more
        if (!rec.counted) { stats.pending++; rec.counted = true; }
      }
    }

    updateLayerUI(key);
    requestRender(true);
    pumpQueue();
    watchLayerAvailability(key);
    if (!quiet) toast(layerName(key));
    return true;
  }

  // ============================================================
  //  Resize
  // ============================================================
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      lastRect = null;
      // viewport size feeds viewLeftTop(), so the readouts and the
      // crosshair's world position must be recomputed too
      updateLabels();
      requestRender(true);
    }, 150);
  });

  // ============================================================
  //  Keyboard
  // ============================================================
  window.addEventListener('keydown', function (e) {
    if (isTyping(e)) return;   // arrows/+/- belong to the input, not the map
    var step = 120;
    if (e.key === '+' || e.key === '=') { zoomBy(0.5); e.preventDefault(); }
    else if (e.key === '-' || e.key === '_') { zoomBy(-0.5); e.preventDefault(); }
    else if (e.key === 'ArrowLeft')  { state.center.x -= step; requestRender(); updateLabels(); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { state.center.x += step; requestRender(); updateLabels(); e.preventDefault(); }
    else if (e.key === 'ArrowUp')    { state.center.y -= step; requestRender(); updateLabels(); e.preventDefault(); }
    else if (e.key === 'ArrowDown')  { state.center.y += step; requestRender(); updateLabels(); e.preventDefault(); }
  });

  // ============================================================
  //  Start
  // ============================================================
  applyLanguage();       // build the layer list + translate the chrome
  setView(HOME.lat, HOME.lng, HOME.zoom);

  setTimeout(function () {
    if (!loaderHidden) maybeHideLoader();
  }, 2500);

  // expose a tiny debug handle
  window.__map = {
    state: state,
    stats: function () {
      return {
        tiles: stats.tiles,
        pending: stats.pending,
        activeZ: activeZ,
        backdrops: Object.keys(backdropZ),
        readyRatio: Math.round(activeReadyRatio() * 100) / 100,
        zoom: state.zoom
      };
    }
  };

})();
</script>
</body>
</html>
