<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>World Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }

  #map { width: 100%; height: 100%; background: #dfe6ec; }

  /* ============ Top bar ============ */
  #topbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 12px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 4px 20px rgba(0,0,0,.16);
    backdrop-filter: blur(10px);
    max-width: calc(100vw - 24px);
  }

  #search {
    width: 300px; padding: 8px 12px; border: 1px solid #d8dee6;
    border-radius: 8px; font-size: 13.5px; outline: none;
    transition: border-color .15s;
    font-family: inherit;
  }
  #search:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.14); }

  .btn {
    padding: 8px 13px; border: 1px solid #d8dee6; border-radius: 8px;
    background: #fff; color: #333; font-size: 13px; cursor: pointer;
    white-space: nowrap; transition: all .15s;
    font-family: inherit;
  }
  .btn:hover { background: #f4f7fb; border-color: #b8c4d4; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .btn.primary:hover { background: #2f6fe0; }
  .btn.active { background: #e8f1ff; border-color: #3b82f6; color: #1d4ed8; }

  .sep { width: 1px; height: 22px; background: #e2e8f0; margin: 0 2px; }

  /* ============ Layer switcher ============ */
  #layers {
    position: fixed; right: 12px; top: 76px; z-index: 1000;
    display: flex; flex-direction: column; gap: 5px;
    padding: 8px; border-radius: 11px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 4px 20px rgba(0,0,0,.16);
    backdrop-filter: blur(10px);
  }
  #layers .title {
    font-size: 10.5px; color: #94a3b8; padding: 1px 5px 4px;
    letter-spacing: .5px; font-weight: 600; text-transform: uppercase;
  }
  #layers button {
    padding: 7px 13px; border: none; border-radius: 7px;
    background: transparent; color: #475569; font-size: 12.5px;
    cursor: pointer; text-align: left; white-space: nowrap;
    transition: all .12s; font-family: inherit;
  }
  #layers button:hover { background: #f1f5f9; color: #1e293b; }
  #layers button.on { background: #3b82f6; color: #fff; font-weight: 500; }

  /* ============ Coordinates ============ */
  #coords {
    position: fixed; left: 12px; bottom: 12px; z-index: 1000;
    padding: 7px 13px; border-radius: 8px;
    background: rgba(255,255,255,.94); color: #475569;
    font-size: 12px; font-family: Consolas, "SF Mono", monospace;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
    backdrop-filter: blur(8px);
  }
  #coords b { color: #2563eb; font-weight: 600; }

  /* ============ Search suggestions ============ */
  #suggest {
    position: fixed; z-index: 1001; display: none;
    background: #fff; border-radius: 9px; overflow: hidden;
    box-shadow: 0 8px 28px rgba(0,0,0,.2);
    max-height: 320px; overflow-y: auto; min-width: 300px;
  }
  #suggest.show { display: block; }
  #suggest .item {
    padding: 9px 13px; font-size: 13px; color: #334155;
    cursor: pointer; border-bottom: 1px solid #f1f5f9;
    line-height: 1.5;
  }
  #suggest .item:last-child { border-bottom: none; }
  #suggest .item:hover, #suggest .item.sel { background: #eff6ff; color: #1d4ed8; }
  #suggest .item .sub { font-size: 11.5px; color: #94a3b8; margin-top: 2px; }

  /* ============ Zoom level ============ */
  #zoomlvl {
    position: fixed; right: 12px; bottom: 12px; z-index: 1000;
    padding: 7px 13px; border-radius: 8px;
    background: rgba(255,255,255,.94); color: #475569;
    font-size: 12px; font-family: Consolas, monospace;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
  }

  /* ============ Leaflet tweaks ============ */
  .leaflet-control-attribution {
    font-size: 10.5px !important; background: rgba(255,255,255,.85) !important;
    padding: 3px 8px !important;
  }
  .leaflet-control-zoom { border: none !important; box-shadow: 0 2px 10px rgba(0,0,0,.15) !important; }
  .leaflet-control-zoom a {
    background: #fff !important; color: #334155 !important;
    border: none !important; font-size: 19px !important;
  }
  .leaflet-control-zoom a:hover { background: #f1f5f9 !important; }

  /* ============ Loading ============ */
  #loading {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    z-index: 2000; padding: 16px 26px; border-radius: 10px;
    background: rgba(30,41,59,.92); color: #fff; font-size: 13.5px;
    display: none;
  }
  #loading.show { display: block; }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <input id="search" placeholder="Search places..." autocomplete="off">
  <button class="btn primary" id="btnSearch">Search</button>
  <div class="sep"></div>
  <button class="btn" id="btnEn">English</button>
  <button class="btn" id="btnNative">Native</button>
  <div class="sep"></div>
  <button class="btn" id="btnLocate" title="Go to my location">Locate</button>
</div>

<div id="layers">
  <div class="title">Layers</div>
  <button data-layer="street" class="on">Street</button>
  <button data-layer="amap">Amap</button>
  <button data-layer="esri">Esri Street</button>
  <button data-layer="amapSat">Amap Satellite</button>
  <button data-layer="esriSat">Esri Satellite</button>
</div>

<div id="coords">Lat <b id="c-lat">&mdash;</b> &nbsp; Lon <b id="c-lng">&mdash;</b></div>
<div id="zoomlvl">Zoom <b id="c-zoom">2</b></div>
<div id="suggest"></div>
<div id="loading">Loading...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  'use strict';

  // ============================================================
  //  Base layers
  // ============================================================
  var LAYERS = {
    street: {
      name: 'Street',
      url: 'https://tile.openstreetmap.de/{z}/{x}/{y}.png',
      attr: '&copy; OpenStreetMap contributors',
      max: 19
    },
    amap: {
      name: 'Amap',
      url: 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
      attr: '&copy; Amap',
      subdomains: '1234',
      max: 18
    },
    esri: {
      name: 'Esri Street',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      attr: 'Esri, HERE, Garmin, USGS',
      max: 19
    },
    amapSat: {
      name: 'Amap Satellite',
      url: 'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
      attr: '&copy; Amap',
      subdomains: '1234',
      max: 18
    },
    esriSat: {
      name: 'Esri Satellite',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      attr: 'Esri, Maxar, Earthstar Geographics',
      max: 19
    }
  };

  // ============================================================
  //  Init map
  // ============================================================
  var map = L.map('map', {
    center: [30, 110],
    zoom: 3,
    zoomControl: true,
    minZoom: 2,
    maxZoom: 19,
    worldCopyJump: true,
    attributionControl: true
  });

  var currentLayer = null;
  var currentKey = 'street';
  var lang = 'en';

  function setLayer(key) {
    var cfg = LAYERS[key];
    if (!cfg) return;

    if (currentLayer) map.removeLayer(currentLayer);

    currentLayer = L.tileLayer(cfg.url, {
      maxZoom: cfg.max,
      maxNativeZoom: cfg.max,
      attribution: cfg.attr,
      subdomains: cfg.subdomains || 'abc',
      crossOrigin: true,
      detectRetina: true
    });
    currentLayer.addTo(map);
    currentKey = key;

    var btns = document.querySelectorAll('#layers button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', btns[i].getAttribute('data-layer') === key);
    }
  }

  setLayer('street');

  // ============================================================
  //  Layer switching
  // ============================================================
  document.querySelectorAll('#layers button').forEach(function (b) {
    b.addEventListener('click', function () {
      setLayer(this.getAttribute('data-layer'));
    });
  });

  // ============================================================
  //  Search language
  // ============================================================
  function setLang(l) {
    lang = l;
    document.getElementById('btnEn').classList.toggle('active', l === 'en');
    document.getElementById('btnNative').classList.toggle('active', l === 'native');
    localStorage.setItem('mapLang', l);
  }
  setLang(localStorage.getItem('mapLang') || 'en');

  document.getElementById('btnEn').addEventListener('click', function () { setLang('en'); });
  document.getElementById('btnNative').addEventListener('click', function () { setLang('native'); });

  // ============================================================
  //  Coordinates
  // ============================================================
  var cLat = document.getElementById('c-lat');
  var cLng = document.getElementById('c-lng');
  var cZoom = document.getElementById('c-zoom');

  function updateCoords(lat, lng) {
    cLat.textContent = lat.toFixed(5);
    cLng.textContent = lng.toFixed(5);
  }
  updateCoords(30, 110);
  cZoom.textContent = map.getZoom();

  map.on('mousemove', function (e) { updateCoords(e.latlng.lat, e.latlng.lng); });
  map.on('zoomend', function () { cZoom.textContent = map.getZoom(); });

  // ============================================================
  //  Search (Photon, OSM based, no API key)
  // ============================================================
  var searchInput = document.getElementById('search');
  var suggestBox = document.getElementById('suggest');
  var searchTimer = null;
  var suggestItems = [];
  var selIndex = -1;
  var lastQuery = '';

  function hideSuggest() {
    suggestBox.classList.remove('show');
    selIndex = -1;
  }

  function positionSuggest() {
    var r = searchInput.getBoundingClientRect();
    suggestBox.style.left = r.left + 'px';
    suggestBox.style.top = (r.bottom + 6) + 'px';
    suggestBox.style.minWidth = r.width + 'px';
  }

  function doSearch(q, cb) {
    if (!q || q.length < 2) return;

    var url = 'https://photon.komoot.io/api/?q=' + encodeURIComponent(q) + '&limit=8';
    if (lang === 'en') url += '&lang=en';

    fetch(url, { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var out = [];
        var feats = (data && data.features) || [];
        for (var i = 0; i < feats.length; i++) {
          var f = feats[i];
          var p = f.properties || {};
          var g = f.geometry || {};
          var coords = g.coordinates || [];
          if (coords.length < 2) continue;

          var bits = [];
          if (p.name) bits.push(p.name);
          if (p.city && p.city !== p.name) bits.push(p.city);
          if (p.state && p.state !== p.name) bits.push(p.state);
          if (p.country) bits.push(p.country);
          var display = bits.join(', ');

          out.push({
            display_name: display,
            name: p.name || '',
            lat: coords[1],
            lon: coords[0],
            type: p.osm_value || p.type || '',
            country: p.country || ''
          });
        }
        cb(out);
      })
      .catch(function () { cb([]); });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showSuggest(list) {
    suggestItems = list;
    if (!list.length) {
      suggestBox.innerHTML = '<div class="item" style="color:#94a3b8;cursor:default">No results found</div>';
      positionSuggest();
      suggestBox.classList.add('show');
      return;
    }
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var d = list[i];
      var name = d.display_name || d.name || '';
      var parts = name.split(',');
      var main = parts[0].trim();
      var sub = parts.slice(1).join(',').trim();
      html += '<div class="item" data-i="' + i + '">' +
                '<div>' + escapeHtml(main) + '</div>' +
                (sub ? '<div class="sub">' + escapeHtml(sub) + '</div>' : '') +
              '</div>';
    }
    suggestBox.innerHTML = html;
    positionSuggest();
    suggestBox.classList.add('show');

    suggestBox.querySelectorAll('.item[data-i]').forEach(function (el) {
      el.addEventListener('click', function () {
        var d = suggestItems[parseInt(this.getAttribute('data-i'), 10)];
        if (d) gotoResult(d);
      });
    });
  }

  function gotoResult(d) {
    var lat = parseFloat(d.lat), lon = parseFloat(d.lon);
    if (isNaN(lat) || isNaN(lon)) return;
    map.setView([lat, lon], 13, { animate: true });
    updateCoords(lat, lon);
    hideSuggest();
    if (window.__marker) map.removeLayer(window.__marker);
    window.__marker = L.marker([lat, lon]).addTo(map)
      .bindPopup(d.display_name || '').openPopup();
    searchInput.value = (d.display_name || '').split(',')[0];
  }

  searchInput.addEventListener('input', function () {
    var q = this.value.trim();
    lastQuery = q;
    clearTimeout(searchTimer);
    if (q.length < 2) { hideSuggest(); return; }
    searchTimer = setTimeout(function () {
      if (q !== lastQuery) return;
      doSearch(q, showSuggest);
    }, 420);
  });

  searchInput.addEventListener('keydown', function (e) {
    var items = suggestBox.querySelectorAll('.item[data-i]');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selIndex = Math.min(selIndex + 1, items.length - 1);
      items.forEach(function (el, i) { el.classList.toggle('sel', i === selIndex); });
      if (items[selIndex]) items[selIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selIndex = Math.max(selIndex - 1, 0);
      items.forEach(function (el, i) { el.classList.toggle('sel', i === selIndex); });
      if (items[selIndex]) items[selIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (selIndex >= 0 && suggestItems[selIndex]) {
        gotoResult(suggestItems[selIndex]);
      } else {
        clearTimeout(searchTimer);
        doSearch(this.value.trim(), showSuggest);
      }
    } else if (e.key === 'Escape') {
      hideSuggest();
    }
  });

  document.getElementById('btnSearch').addEventListener('click', function () {
    clearTimeout(searchTimer);
    doSearch(searchInput.value.trim(), showSuggest);
  });

  document.addEventListener('click', function (e) {
    if (!suggestBox.contains(e.target) && e.target !== searchInput) hideSuggest();
  });

  window.addEventListener('resize', function () {
    if (suggestBox.classList.contains('show')) positionSuggest();
  });

  // ============================================================
  //  Geolocation
  // ============================================================
  var loading = document.getElementById('loading');
  document.getElementById('btnLocate').addEventListener('click', function () {
    if (!navigator.geolocation) {
      alert('Geolocation is not supported by this browser.');
      return;
    }
    loading.classList.add('show');
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        loading.classList.remove('show');
        var lat = pos.coords.latitude, lng = pos.coords.longitude;
        map.setView([lat, lng], 14, { animate: true });
        if (window.__marker) map.removeLayer(window.__marker);
        window.__marker = L.marker([lat, lng]).addTo(map)
          .bindPopup('My location').openPopup();
        updateCoords(lat, lng);
      },
      function () {
        loading.classList.remove('show');
        alert('Unable to get your location. Please allow location access.');
      },
      { enableHighAccuracy: true, timeout: 12000 }
    );
  });

  // ============================================================
  //  Click to read coordinates
  // ============================================================
  map.on('click', function (e) {
    updateCoords(e.latlng.lat, e.latlng.lng);
  });

  // ============================================================
  //  Start
  // ============================================================
  map.setView([32, 112], 4);

})();
</script>
</body>
</html>
