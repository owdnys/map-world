<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>World Map - Static</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #e8eef3; }

  /* ============ Map viewport ============ */
  #viewport {
    position: absolute; inset: 0; overflow: hidden;
    cursor: grab; touch-action: none;
    background: #cfe0ea;
  }
  #viewport.dragging { cursor: grabbing; }

  /* Single GPU-composited container. All tiles live here.
     The container is transformed as a whole - never per-tile. */
  #tiles {
    position: absolute; left: 0; top: 0;
    width: 0; height: 0;
    transform-origin: 0 0;
    will-change: transform;
    backface-visibility: hidden;
  }
  #tiles img {
    position: absolute;
    left: 0; top: 0;
    -webkit-user-drag: none; user-select: none;
    pointer-events: none;
    /* fade in when a tile arrives */
    opacity: 0;
    transition: opacity .18s linear;
  }
  #tiles img.ready { opacity: 1; }

  /* ============ Top bar ============ */
  #topbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 12px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 4px 20px rgba(0,0,0,.16);
    backdrop-filter: blur(10px);
  }

  .btn {
    padding: 8px 13px; border: 1px solid #d8dee6; border-radius: 8px;
    background: #fff; color: #333; font-size: 13px; cursor: pointer;
    white-space: nowrap; transition: all .15s;
    font-family: inherit;
  }
  .btn:hover { background: #f4f7fb; border-color: #b8c4d4; }
  .btn:active { transform: translateY(1px); }
  .btn.icon { padding: 8px 11px; font-size: 15px; line-height: 1; }

  #zoomLabel {
    min-width: 74px; text-align: center; font-size: 12.5px;
    color: #475569; font-family: Consolas, monospace;
  }

  .sep { width: 1px; height: 22px; background: #e2e8f0; margin: 0 2px; }

  /* ============ Layer switcher ============ */
  #layers {
    position: fixed; right: 12px; top: 76px; z-index: 100;
    display: flex; flex-direction: column; gap: 5px;
    padding: 8px; border-radius: 11px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 4px 20px rgba(0,0,0,.16);
    backdrop-filter: blur(10px);
  }
  #layers .title {
    font-size: 10.5px; color: #94a3b8; padding: 1px 5px 4px;
    letter-spacing: .5px; font-weight: 600; text-transform: uppercase;
  }
  #layers button {
    padding: 7px 13px; border: none; border-radius: 7px;
    background: transparent; color: #475569; font-size: 12.5px;
    cursor: pointer; text-align: left; white-space: nowrap;
    transition: all .12s; font-family: inherit;
  }
  #layers button:hover { background: #f1f5f9; color: #1e293b; }
  #layers button.on { background: #3b82f6; color: #fff; font-weight: 500; }

  /* ============ Bottom info ============ */
  #foot {
    position: fixed; left: 12px; bottom: 12px; z-index: 100;
    display: flex; gap: 10px; align-items: center;
  }
  .chip {
    padding: 7px 13px; border-radius: 8px;
    background: rgba(255,255,255,.94); color: #475569;
    font-size: 12px; font-family: Consolas, monospace;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
    backdrop-filter: blur(8px);
  }
  .chip b { color: #2563eb; font-weight: 600; }

  /* ============ Crosshair ============ */
  /* Two plain lines crossing at the viewport centre - no gaps, no dot.
     Pinned to the screen, so it always marks state.center / "Center".
     A white halo keeps it readable on both pale streets and dark satellite. */
  #crosshair {
    position: fixed;
    left: 50%; top: 50%;
    width: 56px; height: 56px;
    margin: -28px 0 0 -28px;
    pointer-events: none;
    z-index: 95;
  }
  #crosshair i {
    position: absolute;
    display: block;
    background: rgba(15,23,42,.85);
    box-shadow: 0 0 0 1px rgba(255,255,255,.9);
  }
  #crosshair .ch-h { left: 0;  top: 50%;    width: 100%; height: 1px; margin-top: -.5px; }
  #crosshair .ch-v { top: 0;   left: 50%;   height: 100%; width: 1px;  margin-left: -.5px; }

  /* ============ Credit ============ */
  #credit {
    position: fixed; right: 12px; bottom: 12px; z-index: 100;
    padding: 5px 10px; border-radius: 6px;
    background: rgba(255,255,255,.88); color: #64748b;
    font-size: 10.5px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }

  /* ============ Loader ============ */
  #loader {
    position: fixed; inset: 0; z-index: 500;
    display: flex; align-items: center; justify-content: center;
    background: #e8eef3; color: #64748b; font-size: 14px;
    transition: opacity .4s;
  }
  #loader.hide { opacity: 0; pointer-events: none; }

  /* ============ Toast ============ */
  #toast {
    position: fixed; left: 50%; bottom: 60px;
    transform: translateX(-50%) translateY(10px);
    z-index: 200; padding: 9px 18px; border-radius: 8px;
    background: rgba(30,41,59,.92); color: #fff; font-size: 12.5px;
    opacity: 0; transition: all .25s; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ Cursor readout ============ */
  #foot .chip.cursor { min-width: 190px; }
  #foot .chip.cursor b { color: #16a34a; }

  /* ============ Bookmarks ============ */
  #bookmarks {
    position: fixed; left: 12px; top: 76px; z-index: 100;
    width: 230px; max-height: 48vh;
    display: none; flex-direction: column;
    border-radius: 11px; overflow: hidden;
    background: rgba(255,255,255,.96);
    box-shadow: 0 4px 20px rgba(0,0,0,.16);
    backdrop-filter: blur(10px);
  }
  #bookmarks.show { display: flex; }

  #bookmarks .bm-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px 6px;
    font-size: 10.5px; color: #94a3b8;
    letter-spacing: .5px; font-weight: 600; text-transform: uppercase;
    border-bottom: 1px solid #eef2f7;
  }
  #bookmarks .bm-head span { color: #cbd5e1; font-weight: 500; letter-spacing: 0; text-transform: none; }

  #bookmarks .bm-list { overflow-y: auto; padding: 4px; }

  .bm-item {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 8px; border-radius: 7px;
    cursor: pointer; transition: background .12s;
  }
  .bm-item:hover { background: #eff6ff; }

  .bm-item .bm-idx {
    flex: 0 0 18px; height: 18px; line-height: 18px;
    text-align: center; border-radius: 50%;
    background: #3b82f6; color: #fff;
    font-size: 10px; font-weight: 600;
  }
  .bm-item .bm-body { flex: 1; min-width: 0; }
  .bm-item .bm-name {
    font-size: 12.5px; color: #1e293b;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bm-item .bm-coord {
    font-size: 10.5px; color: #94a3b8;
    font-family: Consolas, monospace; margin-top: 1px;
  }
  .bm-item .bm-del {
    flex: 0 0 auto; padding: 2px 5px; border: none;
    background: transparent; color: #cbd5e1;
    font-size: 14px; line-height: 1; cursor: pointer; border-radius: 4px;
  }
  .bm-item .bm-del:hover { background: #fee2e2; color: #dc2626; }

  #bookmarks .bm-empty {
    padding: 14px 10px; text-align: center;
    font-size: 11.5px; color: #94a3b8; line-height: 1.6;
  }

  @media (max-width: 640px) {
    #layers { top: auto; bottom: 56px; }
    .chip { font-size: 11px; padding: 6px 9px; }
    #bookmarks { top: 64px; width: 190px; max-height: 38vh; }
    #foot .chip.cursor { min-width: 0; }
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="tiles"></div>
</div>

<div id="crosshair">
  <i class="ch-h"></i><i class="ch-v"></i>
</div>

<div id="topbar">
  <button class="btn icon" id="zoomOut" title="Zoom out">&minus;</button>
  <div id="zoomLabel">Zoom 4</div>
  <button class="btn icon" id="zoomIn" title="Zoom in">+</button>
  <div class="sep"></div>
  <button class="btn" id="btnReset" title="Reset view">Reset</button>
  <button class="btn" id="btnLocate" title="Find my location">Locate</button>
  <button class="btn" id="btnSave" title="Save cursor position (Ctrl+D)">&#9734; Save</button>
</div>

<div id="layers">
  <div class="title">Layers</div>
  <button data-layer="amap" class="on">Amap</button>
  <button data-layer="amapSat">Amap Satellite</button>
  <button data-layer="esri">Esri Street</button>
  <button data-layer="esriSat">Esri Satellite</button>
  <button data-layer="osm">OSM Street</button>
</div>

<div id="bookmarks">
  <div class="bm-head">Saved <span id="bm-count">0</span></div>
  <div class="bm-list" id="bm-list"></div>
</div>

<div id="foot">
  <div class="chip cursor" id="chip-cursor">Cursor&nbsp; <b id="m-lat">&mdash;</b>, <b id="m-lng">&mdash;</b></div>
  <div class="chip">Center <b id="c-lat">&mdash;</b>, <b id="c-lng">&mdash;</b></div>
</div>

<div id="credit">&copy; OpenStreetMap &middot; Amap &middot; Esri</div>
<div id="loader">Loading map...</div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  // ============================================================
  //  Config
  // ============================================================
  var TILE = 256;
  var MIN_Z = 2, MAX_Z = 18;

  // How many extra tile rings to keep around the viewport.
  // 1 ring means panning stays smooth without refetching.
  var PAD = 1;

  var LAYERS = {
    osm: {
      name: 'Street',
      url: 'https://tile.openstreetmap.de/{z}/{x}/{y}.png',
      max: 18,
      credit: '&copy; OpenStreetMap contributors'
    },
    amap: {
      name: 'Amap',
      // wprd is the detailed Amap endpoint. style=7 is the FULL street map
      // (land fill, buildings, parks, roads, labels). style=8 is only the
      // transparent road+label overlay and is meant to be stacked on top of
      // a base layer - using it alone gives roads floating on white.
      url: 'https://wprd0{s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=7',
      subdomains: ['1', '2', '3', '4'],
      // z18 has real detail; z19 comes back as a ~190-byte blank placeholder
      max: 18,
      credit: '&copy; Amap'
    },
    esri: {
      name: 'Esri Street',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      max: 18,
      credit: 'Esri, HERE, Garmin, USGS'
    },
    amapSat: {
      name: 'Amap Satellite',
      url: 'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
      subdomains: ['1', '2', '3', '4'],
      max: 18,
      credit: '&copy; Amap'
    },
    esriSat: {
      name: 'Esri Satellite',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      max: 18,
      credit: 'Esri, Maxar, Earthstar'
    }
  };

  // ============================================================
  //  State
  //  center is kept in world pixels at the CURRENT zoom level.
  // ============================================================
  var state = {
    center: { x: 0, y: 0 },
    zoom: 4,
    // amap is the fastest source by a wide margin (40ms vs 1169ms for OSM)
    layer: 'amap'
  };

  var HOME = { lat: 32, lng: 112, zoom: 4 };

  var viewport = document.getElementById('viewport');
  var tilesBox = document.getElementById('tiles');
  var zoomLabel = document.getElementById('zoomLabel');
  var toastEl = document.getElementById('toast');
  var loader = document.getElementById('loader');

  // ============================================================
  //  Web Mercator projection
  // ============================================================
  function lngToWorldX(lng, z) {
    return (lng + 180) / 360 * Math.pow(2, z) * TILE;
  }
  function latToWorldY(lat, z) {
    var rad = lat * Math.PI / 180;
    var y = Math.log(Math.tan(Math.PI / 4 + rad / 2));
    return (1 - y / Math.PI) / 2 * Math.pow(2, z) * TILE;
  }
  function worldXToLng(x, z) {
    return x / (Math.pow(2, z) * TILE) * 360 - 180;
  }
  function worldYToLat(y, z) {
    var n = Math.PI - 2 * Math.PI * y / (Math.pow(2, z) * TILE);
    return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
  }

  // ============================================================
  //  Tile store
  //
  //  tileMap[key] = { img, z, x, y, ready }
  //  key = "z/x/y"
  //
  //  Tiles are positioned in ACTIVE-Z space. A tile from level
  //  (activeZ - 1) gets doubled in size, (activeZ + 1) halved.
  //  That lets one transform on the container scale everything.
  // ============================================================
  var tileMap = {};
  var activeZ = 4;       // the level currently being rendered

  // Levels kept underneath as a backdrop while the active level loads.
  // A set (not a single level) so that jumping several zoom levels at
  // once still has something to show instead of a blank screen.
  var backdropZ = {};
  var backdropTimer = null;

  // Tiles that scrolled out of view, parked until the view settles.
  // key -> timestamp when it stopped being needed
  var spareTiles = {};
  var tileSweepTimer = null;

  // ------------------------------------------------------------
  //  Render origin
  //
  //  World pixel coordinates at z18 are around 5.5e7. CSS transforms and
  //  GPU compositing use 32-bit floats, whose integers are only exact up
  //  to 2^24 (16.7 million). Feeding 5.5e7 into translate() makes the
  //  browser round the value, and tiles end up pushed off screen - that
  //  is the "zoomed in to a blank page" bug.
  //
  //  Fix: keep every number small. Tile offsetLeft and the container
  //  translate are both expressed relative to renderOrigin, which tracks
  //  the viewport and only moves in whole-tile steps. Every value stays
  //  within a few thousand pixels.
  // ------------------------------------------------------------
  var renderOrigin = { x: 0, y: 0, z: -1 };

  var stats = {
    tiles: 0,
    pending: 0,
    lastFillKey: ''
  };

  function tileUrl(layerKey, z, x, y) {
    var cfg = LAYERS[layerKey];

    // Clamp to the layer's native max. When the user zooms past it we keep
    // requesting the deepest level the source actually has and let the
    // renderer upscale it - a blurry tile beats a blank one.
    var nativeZ = Math.min(z, cfg.max || 18);
    var div = Math.pow(2, z - nativeZ);
    if (div > 1) {
      x = Math.floor(x / div);
      y = Math.floor(y / div);
    }

    var url = cfg.url
      .replace(/\{z\}/g, nativeZ)
      .replace(/\{x\}/g, x)
      .replace(/\{y\}/g, y);
    if (cfg.subdomains) {
      var s = cfg.subdomains[(x + y) % cfg.subdomains.length];
      url = url.replace(/\{s\}/g, s);
    }
    return url;
  }

  // Scale factor for a tile of level z when rendered at activeZ
  function tileScale(z) {
    return Math.pow(2, activeZ - z);
  }

  function createTile(z, x, y) {
    var key = z + '/' + x + '/' + y;
    if (tileMap[key]) return;

    var maxIdx = Math.pow(2, z) - 1;
    var wx = ((x % (maxIdx + 1)) + (maxIdx + 1)) % (maxIdx + 1);

    var img = document.createElement('img');
    img.alt = '';
    img.decoding = 'async';
    img.loading = 'eager';
    // NOTE: do NOT set crossOrigin here. Tile servers such as Amap do not
    // send CORS headers, and requesting the image with crossOrigin makes
    // the load fail outright - which shows up as a blank map after zooming.
    // crossOrigin is only needed when reading pixels back through canvas.

    var rec = { img: img, z: z, x: x, y: y, ready: false, tries: 0 };
    tileMap[key] = rec;
    stats.pending++;

    var url = tileUrl(state.layer, z, wx, y);

    img.onload = function () {
      rec.ready = true;
      stats.pending--;
      img.classList.add('ready');
      maybeDropPrevLevel();
      maybeHideLoader();
    };
    img.onerror = function () {
      // one quiet retry - transient timeouts are common on flaky links
      if (rec.tries < 1) {
        rec.tries++;
        setTimeout(function () {
          if (tileMap[key] === rec) img.src = url + (url.indexOf('?') < 0 ? '?' : '&') + '_r=' + rec.tries;
        }, 400 + Math.random() * 600);
        return;
      }
      stats.pending--;
      img.classList.remove('ready');
      maybeHideLoader();
    };

    // position in activeZ space, relative to renderOrigin (keeps it small)
    placeTile(rec);

    img.src = url;

    tilesBox.appendChild(img);
    stats.tiles++;
  }

  // Put a tile at its position relative to renderOrigin.
  //
  //  mult = 2^(activeZ - rec.z): how much this tile is enlarged to fit the
  //         active level (backdrop tiles are 2x, 4x ...)
  //
  //  left = activeZ position (rec.x * TILE * mult) - renderOrigin
  //
  //  renderOrigin must NOT be multiplied by mult - it already lives in
  //  activeZ space. Multiplying it too pushed every backdrop tile to roughly
  //  double its correct offset, which dragged the old layer left while
  //  zooming.
  function placeTile(rec) {
    var mult = tileScale(rec.z);
    var sz = TILE * mult;
    var px = rec.x * TILE * mult - renderOrigin.x;
    var py = rec.y * TILE * mult - renderOrigin.y;
    rec.img.style.left = px + 'px';
    rec.img.style.top = py + 'px';
    rec.img.style.width = sz + 'px';
    rec.img.style.height = sz + 'px';
  }

  function removeTile(key) {
    var rec = tileMap[key];
    if (!rec) return;
    if (!rec.ready && stats.pending > 0) stats.pending--;
    if (rec.img.parentNode) rec.img.parentNode.removeChild(rec.img);
    rec.img.onload = null;
    rec.img.onerror = null;
    // release the bitmap
    rec.img.src = '';
    delete tileMap[key];
    stats.tiles--;
  }

  function removeLevel(z) {
    var keys = Object.keys(tileMap);
    for (var i = 0; i < keys.length; i++) {
      if (tileMap[keys[i]] && tileMap[keys[i]].z === z) removeTile(keys[i]);
    }
  }

  // Reposition every existing tile after activeZ or renderOrigin changes
  function relayoutTiles() {
    for (var k in tileMap) {
      if (!tileMap.hasOwnProperty(k)) continue;
      placeTile(tileMap[k]);
    }
  }

  // ============================================================
  //  Render origin maintenance
  // ============================================================
  function viewLeftTop(z) {
    var ratio = Math.pow(2, z - state.zoom);
    var cx = state.center.x * ratio;
    var cy = state.center.y * ratio;
    return {
      left: cx - viewport.clientWidth / 2,
      top: cy - viewport.clientHeight / 2
    };
  }

  // Keep renderOrigin within one tile of the viewport corner, in whole-tile
  // steps so tiles do not jitter. Returns true when it moved (caller must
  // relayout).
  function ensureOrigin(z) {
    var lt = viewLeftTop(z);
    var ox = Math.floor(lt.left / TILE) * TILE - TILE;
    var oy = Math.floor(lt.top / TILE) * TILE - TILE;

    if (renderOrigin.z === z &&
        Math.abs(renderOrigin.x - ox) < TILE &&
        Math.abs(renderOrigin.y - oy) < TILE) {
      return false;
    }

    renderOrigin.x = ox;
    renderOrigin.y = oy;
    renderOrigin.z = z;
    return true;
  }

  // ============================================================
  //  Viewport math
  // ============================================================
  function viewRect(z) {
    var vw = viewport.clientWidth;
    var vh = viewport.clientHeight;
    var ratio = Math.pow(2, z - state.zoom);
    var cx = state.center.x * ratio;
    var cy = state.center.y * ratio;
    var left = cx - vw / 2;
    var top = cy - vh / 2;

    return {
      z: z,
      left: left,
      top: top,
      vw: vw,
      vh: vh,
      x0: Math.floor(left / TILE) - PAD,
      y0: Math.floor(top / TILE) - PAD,
      x1: Math.floor((left + vw - 1) / TILE) + PAD,
      y1: Math.floor((top + vh - 1) / TILE) + PAD
    };
  }

  // ============================================================
  //  Fill the active level
  // ============================================================
  var lastRect = null;

  function needsFill(r) {
    if (!lastRect) return true;
    if (lastRect.z !== r.z) return true;
    if (r.x0 < lastRect.x0 || r.x1 > lastRect.x1) return true;
    if (r.y0 < lastRect.y0 || r.y1 > lastRect.y1) return true;
    return false;
  }

  function fillTiles() {
    var z = activeZ;

    // Keep renderOrigin close to the viewport before placing anything.
    // If it moved, every existing tile needs a new offset AND the old
    // range check is meaningless, so force a refill.
    if (ensureOrigin(z)) {
      lastRect = null;
      relayoutTiles();
    }

    var r = viewRect(z);

    if (!needsFill(r)) return;
    lastRect = r;

    var maxIdx = Math.pow(2, z) - 1;
    var need = {};

    for (var tx = r.x0; tx <= r.x1; tx++) {
      for (var ty = r.y0; ty <= r.y1; ty++) {
        if (ty < 0 || ty > maxIdx) continue;
        need[z + '/' + tx + '/' + ty] = true;
        createTile(z, tx, ty);
      }
    }

    // Tiles of the active level that scrolled out of view are NOT removed
    // immediately. During a fast pan the old tiles are the only thing on
    // screen until the new ones arrive, so deleting them right away is
    // what produced the blank flashes. Instead they are parked in a
    // "recently used" set and swept later (see scheduleTileSweep).
    var keys = Object.keys(tileMap);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      var rec = tileMap[k];
      if (!rec) continue;
      if (rec.z === z) {
        if (need[k]) {
          delete spareTiles[k];
        } else {
          // keep it around, but remember that it is no longer needed
          spareTiles[k] = Date.now();
        }
      } else if (!backdropZ[rec.z]) {
        removeTile(k);
      }
    }

    scheduleTileSweep();
  }

  // Parked tiles are released only after the view has settled, so a
  // fast pan always has something to draw underneath.
  //
  // Note the re-arm: a single pass can skip tiles that were parked less
  // than GRACE ms ago, and without rescheduling those skipped tiles would
  // never be released (a fast drag left 300+ tiles in the DOM).
  var SWEEP_GRACE = 1200;

  function scheduleTileSweep() {
    if (tileSweepTimer) clearTimeout(tileSweepTimer);
    tileSweepTimer = setTimeout(runTileSweep, 900);
  }

  function runTileSweep() {
    tileSweepTimer = null;

    // Active level still loading? Keep everything and try again later.
    if (activeReadyRatio() < 0.9) {
      scheduleTileSweep();
      return;
    }

    var now = Date.now();
    var remaining = 0;

    for (var k in spareTiles) {
      if (!spareTiles.hasOwnProperty(k)) continue;
      if (now - spareTiles[k] < SWEEP_GRACE) {
        remaining++;
        continue;
      }
      removeTile(k);
      delete spareTiles[k];
    }

    // Some tiles were still inside the grace window; come back for them.
    if (remaining > 0) scheduleTileSweep();
  }

  // ============================================================
  //  Transform the whole tile container (single GPU op)
  //
  //  Tiles inside the container are placed at (world - renderOrigin).
  //  So the container only has to make up the difference between
  //  renderOrigin and the viewport corner:
  //     screen = (world - renderOrigin) * s + (renderOrigin - left) * s
  //            = (world - left) * s
  //  and (renderOrigin - left) is at most a couple of tiles, so the
  //  translate stays small and keeps full float32 precision.
  // ============================================================
  function applyTransform() {
    var z = activeZ;
    var s = Math.pow(2, state.zoom - z);

    var lt = viewLeftTop(z);

    var px = (renderOrigin.x - lt.left) * s;
    var py = (renderOrigin.y - lt.top) * s;

    tilesBox.style.transform =
      'translate3d(' + px.toFixed(2) + 'px,' + py.toFixed(2) + 'px,0) scale(' + s.toFixed(4) + ')';
  }

  // ============================================================
  //  Level switching
  //
  //  Key performance idea: when zoom crosses an integer level we
  //  build the NEW level and keep the OLD one underneath as a
  //  backdrop. Nothing is torn down until the new level has
  //  loaded, so there is no white flash and no visible rebuild.
  // ============================================================
  function switchLevel(z) {
    if (z === activeZ) return;

    // demote the current level to backdrop instead of dropping it
    backdropZ[activeZ] = true;

    activeZ = z;
    lastRect = null;   // force a refill for the new level
    renderOrigin.z = -1;   // origin is level-specific, rebuild it

    relayoutTiles();
    scheduleBackdropSweep();
    pruneBackdrops();
  }

  // How much of the active level has actually loaded
  function activeReadyRatio() {
    var total = 0, ready = 0;
    for (var k in tileMap) {
      if (!tileMap.hasOwnProperty(k)) continue;
      if (tileMap[k].z !== activeZ) continue;
      total++;
      if (tileMap[k].ready) ready++;
    }
    if (total === 0) return 0;
    return ready / total;
  }

  // Drop backdrop levels once the active level is mostly visible.
  // Never drop them while the active level is still mostly empty -
  // that is exactly what produced the blank map after zooming.
  function pruneBackdrops() {
    if (activeReadyRatio() < 0.85) return;

    for (var z in backdropZ) {
      if (!backdropZ.hasOwnProperty(z)) continue;
      removeLevel(parseInt(z, 10));
      delete backdropZ[z];
    }

    if (backdropTimer) {
      clearTimeout(backdropTimer);
      backdropTimer = null;
    }
  }

  // Safety net: if the active level is still not ready after a long
  // while, keep at most one backdrop and drop the rest, so memory
  // cannot grow without bound.
  function scheduleBackdropSweep() {
    if (backdropTimer) clearTimeout(backdropTimer);
    backdropTimer = setTimeout(function () {
      backdropTimer = null;
      if (activeReadyRatio() >= 0.85) {
        pruneBackdrops();
        return;
      }
      var levels = Object.keys(backdropZ);
      // keep the newest backdrop only
      for (var i = 0; i < levels.length; i++) {
        var lz = parseInt(levels[i], 10);
        if (lz !== activeZ - 1 && lz !== activeZ + 1) {
          removeLevel(lz);
          delete backdropZ[levels[i]];
        }
      }
    }, 15000);
  }

  function maybeDropPrevLevel() {
    if (activeReadyRatio() >= 0.85) pruneBackdrops();
  }

  // ============================================================
  //  Render scheduling
  // ============================================================
  var rafPending = false;

  function requestRender(forceFill) {
    if (rafPending) return;
    rafPending = true;

    requestAnimationFrame(function () {
      rafPending = false;

      var z = Math.round(state.zoom);
      z = Math.max(MIN_Z, Math.min(MAX_Z, z));

      if (z !== activeZ) switchLevel(z);

      // Always call fillTiles. It is cheap when nothing changed (needsFill
      // bails out after a few comparisons) and, crucially, this is the only
      // path that adds tiles while panning. Gating it behind a "fill
      // requested" flag meant dragging never loaded anything new.
      fillTiles();
      applyTransform();
    });
  }

  // ============================================================
  //  Loader / toast
  // ============================================================
  var loaderHidden = false;
  function maybeHideLoader() {
    if (loaderHidden) return;
    if (stats.tiles === 0) return;
    loaderHidden = true;
    loader.classList.add('hide');
  }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 1600);
  }

  // ============================================================
  //  View helpers
  // ============================================================
  function setView(lat, lng, zoom) {
    state.zoom = Math.max(MIN_Z, Math.min(MAX_Z, zoom));
    state.center.x = lngToWorldX(lng, state.zoom);
    state.center.y = latToWorldY(lat, state.zoom);

    // rebuild the tile level from scratch
    var keys = Object.keys(tileMap);
    for (var i = 0; i < keys.length; i++) removeTile(keys[i]);
    backdropZ = {};
    activeZ = Math.round(state.zoom);
    lastRect = null;
    renderOrigin.z = -1;

    updateLabels();
    requestRender(true);
  }

  function updateLabels() {
    var lat = worldYToLat(state.center.y, state.zoom);
    var lng = worldXToLng(state.center.x, state.zoom);
    document.getElementById('c-lat').textContent = lat.toFixed(5);
    document.getElementById('c-lng').textContent = lng.toFixed(5);
    zoomLabel.textContent = 'Zoom ' + state.zoom.toFixed(1);
    // keep the cursor/centre readout in sync after any view change
    if (typeof renderCursor === 'function') renderCursor();
  }

  // ============================================================
  //  Screen -> lon/lat
  //
  //  A screen point maps back to the world through the same transform
  //  chain used for rendering:
  //     screen = (world - lt.left) * s
  //  so world = screen / s + lt.left
  // ============================================================
  function screenToLatLng(px, py) {
    var z = activeZ;
    var s = Math.pow(2, state.zoom - z);
    var lt = viewLeftTop(z);
    var wx = px / s + lt.left;
    var wy = py / s + lt.top;
    return {
      lat: worldYToLat(wy, z),
      lng: worldXToLng(wx, z)
    };
  }

  function zoomBy(delta, anchorX, anchorY) {
    var oldZoom = state.zoom;
    var newZoom = Math.max(MIN_Z, Math.min(MAX_Z, oldZoom + delta));
    if (newZoom === oldZoom) return;

    var vw = viewport.clientWidth;
    var vh = viewport.clientHeight;

    if (anchorX === undefined) anchorX = vw / 2;
    if (anchorY === undefined) anchorY = vh / 2;

    // world point under the anchor, in OLD zoom space
    var wx = state.center.x + (anchorX - vw / 2);
    var wy = state.center.y + (anchorY - vh / 2);

    var ratio = Math.pow(2, newZoom - oldZoom);
    wx *= ratio;
    wy *= ratio;

    state.center.x = wx - (anchorX - vw / 2);
    state.center.y = wy - (anchorY - vh / 2);
    state.zoom = newZoom;

    updateLabels();
    requestRender();
  }

  // ============================================================
  //  Drag
  // ============================================================
  var dragging = false;
  var dragStart = null;

  viewport.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    dragging = true;
    dragStart = {
      x: e.clientX, y: e.clientY,
      cx: state.center.x, cy: state.center.y
    };
    viewport.classList.add('dragging');
    e.preventDefault();
  });

  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - dragStart.x;
    var dy = e.clientY - dragStart.y;
    state.center.x = dragStart.cx - dx;
    state.center.y = dragStart.cy - dy;
    updateLabels();
    requestRender();
  });

  window.addEventListener('mouseup', function () {
    if (!dragging) return;
    dragging = false;
    viewport.classList.remove('dragging');
  });

  // ============================================================
  //  Touch
  // ============================================================
  var touchState = null;

  viewport.addEventListener('touchstart', function (e) {
    if (e.touches.length === 1) {
      var t = e.touches[0];
      touchState = {
        mode: 'pan',
        x: t.clientX, y: t.clientY,
        cx: state.center.x, cy: state.center.y
      };
    } else if (e.touches.length === 2) {
      var t1 = e.touches[0], t2 = e.touches[1];
      touchState = {
        mode: 'pinch',
        dist: Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY),
        zoom: state.zoom,
        midX: (t1.clientX + t2.clientX) / 2,
        midY: (t1.clientY + t2.clientY) / 2
      };
    }
    e.preventDefault();
  }, { passive: false });

  viewport.addEventListener('touchmove', function (e) {
    if (!touchState) return;
    if (touchState.mode === 'pan' && e.touches.length === 1) {
      var t = e.touches[0];
      state.center.x = touchState.cx - (t.clientX - touchState.x);
      state.center.y = touchState.cy - (t.clientY - touchState.y);
      updateLabels();
      requestRender();
    } else if (touchState.mode === 'pinch' && e.touches.length === 2) {
      var t1 = e.touches[0], t2 = e.touches[1];
      var d = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      var ratio = d / touchState.dist;
      var targetZoom = touchState.zoom + Math.log2(ratio);
      targetZoom = Math.max(MIN_Z, Math.min(MAX_Z, targetZoom));
      var dz = targetZoom - state.zoom;
      if (Math.abs(dz) > 0.02) zoomBy(dz, touchState.midX, touchState.midY);
    }
    e.preventDefault();
  }, { passive: false });

  viewport.addEventListener('touchend', function (e) {
    if (e.touches.length === 0) {
      touchState = null;
    } else if (e.touches.length === 1) {
      var t = e.touches[0];
      touchState = {
        mode: 'pan',
        x: t.clientX, y: t.clientY,
        cx: state.center.x, cy: state.center.y
      };
    }
  });

  // ---- wheel zoom ----
  // Accumulate wheel deltas and apply them on the next frame.
  // This keeps a fast scroll wheel from firing dozens of renders.
  var wheelAccum = 0;
  var wheelAnchor = { x: 0, y: 0 };
  var wheelRaf = false;

  viewport.addEventListener('wheel', function (e) {
    e.preventDefault();
    wheelAnchor.x = e.clientX;
    wheelAnchor.y = e.clientY;

    var step = e.deltaMode === 1 ? 0.25 : 0.15;
    wheelAccum += (e.deltaY > 0 ? -step : step);

    if (wheelRaf) return;
    wheelRaf = true;
    requestAnimationFrame(function () {
      wheelRaf = false;
      var d = wheelAccum;
      wheelAccum = 0;
      if (Math.abs(d) < 0.01) return;
      // clamp a single frame's jump
      if (d > 1) d = 1;
      if (d < -1) d = -1;
      zoomBy(d, wheelAnchor.x, wheelAnchor.y);
    });
  }, { passive: false });

  // ---- double click zoom ----
  viewport.addEventListener('dblclick', function (e) {
    zoomBy(1, e.clientX, e.clientY);
  });

  // ============================================================
  //  Buttons
  // ============================================================
  document.getElementById('zoomIn').addEventListener('click', function () { zoomBy(1); });
  document.getElementById('zoomOut').addEventListener('click', function () { zoomBy(-1); });
  document.getElementById('btnReset').addEventListener('click', function () {
    setView(HOME.lat, HOME.lng, HOME.zoom);
    toast('View reset');
  });

  // Jump straight to the user's own neighbourhood at street level.
  document.getElementById('btnLocate').addEventListener('click', function () {
    if (!navigator.geolocation) {
      toast('Geolocation not supported');
      return;
    }
    toast('Locating...');
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        setView(pos.coords.latitude, pos.coords.longitude, 17);
        toast('Located - zoom in for more detail');
      },
      function () {
        toast('Location denied or unavailable');
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
    );
  });

  // ============================================================
  //  Cursor readout + bookmarks
  //
  //  Bookmarks are kept in a plain array on purpose. There is no
  //  localStorage / IndexedDB anywhere in this page, so a refresh or a
  //  reopened tab starts with an empty list - exactly as requested.
  // ============================================================
  var M_LAT = document.getElementById('m-lat');
  var M_LNG = document.getElementById('m-lng');
  var bmBox = document.getElementById('bookmarks');
  var bmList = document.getElementById('bm-list');
  var bmCount = document.getElementById('bm-count');

  var bookmarks = [];          // [{ lat, lng, zoom }]
  var cursorLL = null;         // last lon/lat under the pointer

  function renderCursor() {
    if (cursorLL) {
      M_LAT.textContent = cursorLL.lat.toFixed(5);
      M_LNG.textContent = cursorLL.lng.toFixed(5);
    } else {
      // pointer outside the map: fall back to the view centre
      M_LAT.textContent = worldYToLat(state.center.y, state.zoom).toFixed(5);
      M_LNG.textContent = worldXToLng(state.center.x, state.zoom).toFixed(5);
    }
  }

  viewport.addEventListener('mousemove', function (e) {
    var r = viewport.getBoundingClientRect();
    cursorLL = screenToLatLng(e.clientX - r.left, e.clientY - r.top);
    renderCursor();
  });

  viewport.addEventListener('mouseleave', function () {
    cursorLL = null;
    renderCursor();
  });

  // ---- bookmarks ----
  function renderBookmarks() {
    bmCount.textContent = bookmarks.length;

    if (bookmarks.length === 0) {
      bmBox.classList.remove('show');
      bmList.innerHTML = '';
      return;
    }

    bmBox.classList.add('show');
    var html = '';
    for (var i = 0; i < bookmarks.length; i++) {
      var b = bookmarks[i];
      html +=
        '<div class="bm-item" data-i="' + i + '">' +
          '<div class="bm-idx">' + (i + 1) + '</div>' +
          '<div class="bm-body">' +
            '<div class="bm-name">' + b.lat.toFixed(4) + ', ' + b.lng.toFixed(4) + '</div>' +
            '<div class="bm-coord">z' + b.zoom.toFixed(1) + '</div>' +
          '</div>' +
          '<button class="bm-del" data-del="' + i + '" title="Remove">&times;</button>' +
        '</div>';
    }
    bmList.innerHTML = html;

    bmList.querySelectorAll('.bm-item').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.classList.contains('bm-del')) return;   // delete handled below
        var b = bookmarks[parseInt(this.getAttribute('data-i'), 10)];
        if (!b) return;
        setView(b.lat, b.lng, b.zoom);
        toast('Jumped to saved point');
      });
    });

    bmList.querySelectorAll('.bm-del').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var i = parseInt(this.getAttribute('data-del'), 10);
        bookmarks.splice(i, 1);
        renderBookmarks();
        toast('Removed');
      });
    });
  }

  function saveCurrentPoint() {
    // Prefer the point under the pointer; fall back to the view centre.
    var lat, lng;
    if (cursorLL) {
      lat = cursorLL.lat;
      lng = cursorLL.lng;
    } else {
      lat = worldYToLat(state.center.y, state.zoom);
      lng = worldXToLng(state.center.x, state.zoom);
    }

    // ignore an accidental duplicate of the previous save
    var last = bookmarks[bookmarks.length - 1];
    if (last && Math.abs(last.lat - lat) < 1e-6 && Math.abs(last.lng - lng) < 1e-6) {
      toast('Already saved');
      return;
    }

    bookmarks.push({ lat: lat, lng: lng, zoom: state.zoom });
    renderBookmarks();
    toast('Saved #' + bookmarks.length);
  }

  document.getElementById('btnSave').addEventListener('click', saveCurrentPoint);

  // Ctrl+D / Cmd+D saves the point under the cursor
  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) {
      e.preventDefault();
      saveCurrentPoint();
    }
  });

  renderCursor();
  renderBookmarks();

  // ============================================================
  //  Layer switching
  // ============================================================
  document.querySelectorAll('#layers button').forEach(function (b) {
    b.addEventListener('click', function () {
      var key = this.getAttribute('data-layer');
      if (!LAYERS[key]) return;
      if (key === state.layer) return;

      state.layer = key;

      // swap sources on existing tiles instead of rebuilding
      var keys = Object.keys(tileMap);
      for (var i = 0; i < keys.length; i++) {
        var rec = tileMap[keys[i]];
        if (!rec) continue;
        var maxIdx = Math.pow(2, rec.z) - 1;
        var wx = ((rec.x % (maxIdx + 1)) + (maxIdx + 1)) % (maxIdx + 1);
        rec.ready = false;
        rec.img.classList.remove('ready');
        rec.img.src = tileUrl(key, rec.z, wx, rec.y);
      }

      document.querySelectorAll('#layers button').forEach(function (x) {
        x.classList.toggle('on', x === b);
      });
      document.getElementById('credit').innerHTML = LAYERS[key].credit;
      toast('Layer: ' + LAYERS[key].name);
    });
  });

  // ============================================================
  //  Resize
  // ============================================================
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      lastRect = null;
      // viewport size feeds viewLeftTop(), so the readouts and the
      // crosshair's world position must be recomputed too
      updateLabels();
      requestRender(true);
    }, 150);
  });

  // ============================================================
  //  Keyboard
  // ============================================================
  window.addEventListener('keydown', function (e) {
    var step = 120;
    if (e.key === '+' || e.key === '=') { zoomBy(0.5); e.preventDefault(); }
    else if (e.key === '-' || e.key === '_') { zoomBy(-0.5); e.preventDefault(); }
    else if (e.key === 'ArrowLeft')  { state.center.x -= step; requestRender(); updateLabels(); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { state.center.x += step; requestRender(); updateLabels(); e.preventDefault(); }
    else if (e.key === 'ArrowUp')    { state.center.y -= step; requestRender(); updateLabels(); e.preventDefault(); }
    else if (e.key === 'ArrowDown')  { state.center.y += step; requestRender(); updateLabels(); e.preventDefault(); }
  });

  // ============================================================
  //  Start
  // ============================================================
  setView(HOME.lat, HOME.lng, HOME.zoom);

  setTimeout(function () {
    if (!loaderHidden) maybeHideLoader();
  }, 2500);

  // expose a tiny debug handle
  window.__map = {
    state: state,
    stats: function () {
      return {
        tiles: stats.tiles,
        pending: stats.pending,
        activeZ: activeZ,
        backdrops: Object.keys(backdropZ),
        readyRatio: Math.round(activeReadyRatio() * 100) / 100,
        zoom: state.zoom
      };
    }
  };

})();
</script>
</body>
</html>
